}
.tab-button:focus-visible {

}
.tab-content {

}
.tab-content.active {

/* 凡例 */
.legend {

.legend-item {

.legend-dot {

}
.timeline {
  position: relative;
  width: 4200px;
  height: 300px;
  margin: 0 auto;
}
.timeline-line {
  position: absolute;
  left: 55px;
  right: 55px;
  top: 210px;
  height: 7px;
  background: var(--accent);
  border-radius: 999px;
  z-index: 1;
}
.slide-guide-text {
  position: absolute;
  left: 55px;
  top: 174px;
  color: var(--accent);
  font-size: .8rem;
  letter-spacing: .08em;
  white-space: nowrap;
  z-index: 10;
}
.fixed-arrow-head {
  position: absolute;
  right: 3px;
  top: calc(var(--timeline-top-space) + 199px);
  width: 0;
  height: 0;
  border-top: 15px solid transparent;
  border-bottom: 15px solid transparent;
  border-left: 25px solid var(--accent);
  pointer-events: none;
  z-index: 100;
}

/* 区分 */

}

.division-2 {

}
.current-section-label {

  left: 50%;

  letter-spacing: .08em;
  opacity: .65;
  white-space: nowrap;
  pointer-events: none;

/* 作品ポイント */

/* reader.html と共通のブックマーク情報を表示する */
const bookmarkStorageKey = "otomeza-bookmarked-works-v1";

function getBookmarkedIds() {
  try {
    const data = JSON.parse(
      localStorage.getItem(bookmarkStorageKey) || "[]"
    );
    return new Set(Array.isArray(data) ? data : []);
  } catch (_) {
    return new Set();
  }
}

function bookmarkIdForWork(work) {
  try {
    return new URL(work.href, location.href)
      .searchParams.get("work");
  } catch (_) {
    return null;
  }
}

function refreshBookmarkMarks() {
  const ids = getBookmarkedIds();
  document.querySelectorAll("[data-bookmark-id]").forEach(element => {
    element.classList.toggle(
      "bookmarked",
      ids.has(element.dataset.bookmarkId)
    );
  });
}

window.addEventListener("pageshow", refreshBookmarkMarks);
window.addEventListener("storage", event => {
  if (event.key === bookmarkStorageKey) {
    refreshBookmarkMarks();
  }
});

/* novels.js の本文から文字数を自動計算します。
   空白（全角・半角）・改行・タブは数えず、句読点や記号は数えます。
   Unicode の文字単位で数えるため、絵文字なども適切に扱います。 */
const novelTextById = new Map(
  (typeof novels !== "undefined" ? novels : []).map(novel => [novel.id, novel.text])
);

works.forEach(work => {
  const workId = new URL(work.href, window.location.href).searchParams.get("work");
  const text = novelTextById.get(workId);
  if (typeof text === "string") {
    work.characters = Array.from(text.replace(/\s/g, "")).length;
  } else {
    // 本文が見つからない場合、仮の999字を表示しません。
    work.characters = null;
    console.warn("文字数を計算できませんでした:", work.title, workId);
  }
});

/* 執筆日・文字数の表示 */
works.forEach((work, index) => {
  work.originalIndex = index;
});

const chronologicalWorks = [...works].sort((a, b) =>
  a.date.localeCompare(b.date) ||
  a.originalIndex - b.originalIndex
);

function displayDate(work) {
  return work.endDate
    ? `${work.date} ～ ${work.endDate}`
    : work.date;
}

function displayCharacters(work) {
  if (
    work.characters === undefined ||
    work.characters === null
  ) {
    return "";
  }
  return `${Number(work.characters).toLocaleString("ja-JP")}字`;
}

let activePoint = null;
let activeButton = null;

/* ポップアップの位置 */
function positionPopup(button) {
  const rect =
    button.getBoundingClientRect();

  const popupWidth =
    popup.offsetWidth;
  const popupHeight =
    popup.offsetHeight;

  const margin = 12;
  const gap = 12;

  let left =
    rect.left +
    rect.width / 2 -
    popupWidth / 2;

  let top =
    rect.top -
    popupHeight -
    gap;

  left = Math.max(
    margin,
    Math.min(
      left,
      window.innerWidth - popupWidth - margin
    )
  );

  if (top < margin) {
    top = rect.bottom + gap;
  }

  if (
    top + popupHeight >
    window.innerHeight - margin
  ) {
    top =
      window.innerHeight -
      popupHeight -
      margin;
  }

  top = Math.max(margin, top);

  popup.style.left = `${left}px`;
  popup.style.top = `${top}px`;
}

/* ポップアップを開く */
function openPopup(work, point, button) {
  closePopup();

  popupTitle.textContent =
    work.title;
  popupDate.textContent =
    displayDate(work);

  const characters =
    displayCharacters(work);

  popupCharacters.textContent =
    characters;

  popupCharacters.style.display =
    characters ? "block" : "none";

  popupDetail.textContent =
    work.detail;
  popupLink.href =
    work.href;

  activePoint = point;
  activeButton = button;

  button.setAttribute(
    "aria-expanded",
    "true"
  );

  popup.classList.add("open");
  popup.setAttribute(
    "aria-hidden",
    "false"
  );

  positionPopup(button);
}

/* ポップアップを閉じる */
function closePopup() {
  popup.classList.remove("open");
  popup.setAttribute(
    "aria-hidden",
    "true"
  );

  if (activeButton) {
    activeButton.setAttribute(
      "aria-expanded",
      "false"
    );
  }

  activePoint = null;
  activeButton = null;
}

/* ×ボタン */

});

    tabButtons.forEach(item => {
      item.classList.remove("active");
      item.setAttribute("aria-selected", "false");
    });

    tabContents.forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    button.setAttribute(
      "aria-selected",
      "true"
    );

    document
      .getElementById(button.dataset.tab)
      .classList.add("active");

    if (button.dataset.tab === "timeline-tab") {
      requestAnimationFrame(() => {
        adjustTimelineHeight();
        updateSectionLabel();
      });
    }
  });
});

/* 関係性タイムライン */
const timeline =
  document.getElementById("timeline");

const groups = {};

works.forEach(work => {
  const key = work.score.toFixed(1);

  if (!groups[key]) {
    groups[key] = [];
  }

  groups[key].push(work);
});

Object.values(groups).forEach(group => {
  group.sort((a, b) =>
    a.date.localeCompare(b.date) ||
    a.originalIndex - b.originalIndex
  );
});

works.forEach(work => {
  const group =
    groups[work.score.toFixed(1)];

  const index =
    group.indexOf(work);

  const offset =
    -58 - ((group.length - 1 - index) * 52);

  createTimelinePoint(work, offset);
});

/* 作品ポイント生成 */
function createTimelinePoint(work, offset) {
  const point =
    document.createElement("div");

  point.className = "story-point";
  point.dataset.bookmarkId = bookmarkIdForWork(work) || "";

  if (work.parody) {
    point.classList.add("parody");
  }

  if (work.latest) {
    point.classList.add("latest");
  }

  const x =
    8 +
    ((work.score - 2.5) / (9.6 - 2.5)) * 89.5;

  point.style.setProperty(
    "--x",
    `${x}%`
  );

  point.style.setProperty(
    "--offset",
    `${offset}px`
  );

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "point-button";

  button.setAttribute(
    "aria-label",
    work.title
  );

  button.setAttribute(
    "aria-expanded",
    "false"
  );

  button.textContent =
    Array.from(work.title)[0];

  point.appendChild(button);
  timeline.appendChild(point);

  button.addEventListener("click", event => {
    event.stopPropagation();

    if (activePoint === point) {
      closePopup();
      return;
    }

    openPopup(work, point, button);
  });
}

      link.textContent = work.title;

      const meta =

      meta.className = "work-meta";

      const characters =
        document.createElement("span");

      characters.className =
        "work-characters";

      characters.textContent =
        displayCharacters(work);

      if (displayCharacters(work)) {
        meta.appendChild(characters);
      }

      if (work.parody) {
        const type =
          document.createElement("span");

        type.className = "work-type";
        type.textContent = "パロディ";

        meta.appendChild(type);
      }

      info.appendChild(link);

      if (meta.children.length > 0) {
        info.appendChild(meta);
      }

      item.append(
        date,
        info
      );

      list.appendChild(item);
    });

  block.append(
    heading,
    list
  );

  writingOrder.appendChild(block);
});

/* タイムラインの区分名 */
const timelineScroll =
  document.querySelector(".timeline-scroll");

const currentSectionLabel =
  document.getElementById("current-section-label");

const division1 =
  document.querySelector(".division-1");

const division2 =
  document.querySelector(".division-2");

/* 凡例（本編・パロディ・最新の小説）の位置は変えず、
   下の区分名が画面の上から約85%に来るように余白を調整。 */
function adjustTimelineHeight() {
  const area = document.querySelector(".timeline-area");
  if (!area || !document.getElementById("timeline-tab").classList.contains("active")) return;
  const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const areaTop = area.getBoundingClientRect().top;
  // 区分名はタイムラインの上余白 + 250px の位置に表示されます。
  const desiredSpace = viewportHeight * 0.85 - areaTop - 250;
  // 作品ポイントが上部で見切れないよう最低限の余白を確保します。
  const minSpace = window.matchMedia("(max-width: 600px)").matches ? 70 : 100;
  const space = Math.max(minSpace, Math.min(340, desiredSpace));
  area.style.setProperty("--timeline-top-space", `${space}px`);
}

function updateSectionLabel() {
  const timelineRect =
    timeline.getBoundingClientRect();

  const scrollRect =
    timelineScroll.getBoundingClientRect();

  const centerX =
    scrollRect.left +
    scrollRect.width / 2 -
    timelineRect.left;

  if (centerX >= division2.offsetLeft) {
    currentSectionLabel.textContent =
      "その後";
  } else if (centerX >= division1.offsetLeft) {
    currentSectionLabel.textContent =
      "諸国行脚";
  } else {
    currentSectionLabel.textContent =
      "仙薬捜索";
  }
}

/* スクロール時 */
timelineScroll.addEventListener(
  "scroll",
  () => {
    updateSectionLabel();
    closePopup();
  },
  { passive: true }
);

/* 画面サイズ変更時 */

  adjustTimelineHeight();
  updateSectionLabel();

  if (activeButton) {

});
