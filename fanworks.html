  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #1d3652;
      color: #ffffff;
      font-family: "Yu Mincho", "游明朝", "YuMincho", serif;
    }

    button,
    a {
      font-family: inherit;
    }

    .page {
      width: min(1200px, 94%);
      margin: 0 auto;
      padding: 4rem 0 5rem;
    }

    .page-title {
      margin: 0 0 2.5rem;
      text-align: center;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    /* --------------------
       タブ
    -------------------- */

    .tabs {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }

    .tab-button {
      padding: 0.5rem 0.2rem;
      background: transparent;
      color: #ffffff;
      border: none;
      border-bottom: 1px solid transparent;

      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.55;

      transition:
        opacity 0.2s ease,
        border-color 0.2s ease;
    }

    .tab-button.active {
      opacity: 1;
      border-bottom-color: #28bfb0;
    }

    .tab-button:focus-visible {
      outline: 2px solid #28bfb0;
      outline-offset: 5px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* --------------------
       凡例
    -------------------- */

    .legend {
      display: flex;
      justify-content: center;
      gap: 1.5rem;

      margin-bottom: 1rem;

      font-size: 0.8rem;
      opacity: 0.7;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ffffff;
    }

    .legend-dot.parody {
      background: transparent;
      border: 1.5px solid #ffffff;
    }

    /* --------------------
       時系列
    -------------------- */

    .timeline-scroll {
      overflow-x: auto;
      overflow-y: visible;

      padding: 8rem 1rem 9rem;

      scrollbar-color: rgba(255,255,255,0.25) transparent;
    }

    .timeline {
      position: relative;

      width: 1800px;
      height: 300px;

      margin: 0 auto;
    }

    .timeline-line {
      position: absolute;

      left: 55px;
      right: 70px;
      top: 150px;

      height: 2px;

      background: rgba(255, 255, 255, 0.8);
    }

    .timeline-line::after {
      content: "";

      position: absolute;
      right: -16px;
      top: 50%;

      transform: translateY(-50%);

      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 16px solid rgba(255, 255, 255, 0.8);
    }

    /* 4.0 / 8.0 の境界線 */

    .division-line {
      position: absolute;

      top: 92px;
      height: 116px;
      width: 1px;

      background: rgba(255, 255, 255, 0.28);
    }

    .division-1 {
      left: 40%;
    }

    .division-2 {
      left: 80%;
    }

    /* 区分名 */

    .section-label {
      position: absolute;
      top: 218px;

      transform: translateX(-50%);

      font-size: 0.86rem;
      letter-spacing: 0.08em;
      opacity: 0.65;
      white-space: nowrap;
    }

    .section-label-1 {
      left: 20%;
    }

    .section-label-2 {
      left: 60%;
    }

    .section-label-3 {
      left: 90%;
    }

    /* 数字 */

    .scale-label {
      position: absolute;
      top: 167px;

      transform: translateX(-50%);

      font-size: 0.72rem;
      opacity: 0.45;
    }

    .scale-0 {
      left: 3%;
    }

    .scale-4 {
      left: 40%;
    }

    .scale-8 {
      left: 80%;
    }

    .scale-10 {
      left: 97%;
    }

    /* --------------------
       作品の点
    -------------------- */

    .story-point {
      position: absolute;

      left: var(--x);
      top: calc(150px + var(--offset, 0px));

      transform: translate(-50%, -50%);

      z-index: 5;
    }

    .point-button {
      display: block;

      width: 13px;
      height: 13px;

      padding: 0;

      border: none;
      border-radius: 50%;

      background: #ffffff;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .point-button:hover,
    .point-button:focus-visible {
      background: #28bfb0;
      transform: scale(1.2);
      outline: none;
    }

    /* --------------------
       小ウィンドウ
    -------------------- */

    .story-popup {
      position: absolute;

      left: 50%;
      bottom: 16px;

      transform:
        translateX(-50%)
        translateY(5px);

      width: 265px;

      padding: 1rem 1.1rem;

      background: #ffffff;
      color: #1d3652;

      border-radius: 8px;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.25);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        visibility 0.18s ease;

      text-align: left;

      z-index: 30;
    }

    /* 点からウィンドウまでの透明な橋 */
    .story-popup::before {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: -16px;

      height: 16px;
    }

    .story-popup::after {
      content: "";

      position: absolute;

      top: 100%;
      left: 50%;

      transform: translateX(-50%);

      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid #ffffff;
    }

    .story-point:hover .story-popup,
    .story-point:focus-within .story-popup,
    .story-point.open .story-popup {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;

      transform:
        translateX(-50%)
        translateY(0);
    }

    .story-title {
      margin: 0 0 0.45rem;

      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .story-date {
      margin: 0 0 0.6rem;

      font-size: 0.79rem;
      line-height: 1.5;

      opacity: 0.6;
    }

    .story-detail {
      margin: 0 0 0.85rem;

      font-size: 0.83rem;
      line-height: 1.7;
    }

    .story-link {
      display: inline-block;

      color: #1d3652;

      font-size: 0.85rem;

      text-decoration: none;

      border-bottom: 1px solid #28bfb0;
    }

    .story-link:hover {
      opacity: 0.6;
    }

    /* --------------------
       パロディ
    -------------------- */

    .story-point.parody .point-button {
      background: #1d3652;
      border: 2px solid #ffffff;
    }

    .story-point.parody .point-button:hover,
    .story-point.parody .point-button:focus-visible {
      border-color: #28bfb0;
    }

    .story-point.parody-top {
      top: 55px;
    }

    .story-point.parody-bottom {
      top: 255px;
    }

    /* --------------------
       執筆順
    -------------------- */

    .writing-order {
      max-width: 760px;
      margin: 0 auto;
    }

    .year-block {
      margin-bottom: 3.7rem;
    }

    .year-title {
      margin: 0 0 1.3rem;

      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.12em;

      opacity: 0.7;
    }

    .work-list {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    .work-list li {

      gap: 1rem;
      align-items: baseline;

      border-bottom:

    }

      color: #ffffff;

      text-decoration: none;
    }

    .work-list a:hover {
      opacity: 0.65;
    }

    .work-type {
      font-size: 0.72rem;

      opacity: 0.5;
      white-space: nowrap;
    }

    /* --------------------
       戻る
    -------------------- */

    .back-link {
      display: block;

      width: fit-content;

      margin: 5rem auto 0;

        gap: 0.25rem;

  </style>

        date: "2026年秋",
        detail: "ふたりがふたたび出会ってすぐの小説",
        score: 4.0,
        href: "works/saikai-no-yoru.html"
      },

      {
        title: "相克の逢",
        date: "時期未記載",
        detail: "タオが伝わる感覚についての140字小説",
        score: 8.4,
        href: "works/sokoku-no-ai.html"
      },

      {
        title: "乱し満たすもの",
        date: "時期未記載",
        detail: "たったひとことの切り返しに惑う140字小説",
        score: 8.5,
        href: "works/midashi-mitasu-mono.html"
      },

      {
        title: "共に過ごす時間",
        date: "時期未記載",
        detail: "傷も歳も受け入れるほどの、140字小説",
        score: 9.0,
        href: "works/tomo-ni-sugosu-jikan.html"
      }

    ];


    /*
      ===================================
      タブ切り替え
      ===================================
    */

    const tabButtons =
      document.querySelectorAll(".tab-button");

    const tabContents =
      document.querySelectorAll(".tab-content");

    tabButtons.forEach((button) => {

      button.addEventListener("click", () => {

        tabButtons.forEach((item) => {
          item.classList.remove("active");
          item.setAttribute(
            "aria-selected",
            "false"
          );
        });

        tabContents.forEach((item) => {
          item.classList.remove("active");
        });

        button.classList.add("active");

        button.setAttribute(
          "aria-selected",
          "true"
        );

        document
          .getElementById(button.dataset.tab)
          .classList.add("active");

      });

    });


    /*
      ===================================
      時系列を作る
      ===================================
    */

    const timeline =
      document.getElementById("timeline");

    const normalWorks =
      works.filter((work) => !work.parody);

    /*
      同じ数値が重なったとき、
      少しだけ上下にずらします。
    */

    const groups = {};

    normalWorks.forEach((work) => {

      const key =
        work.score.toFixed(1);

      if (!groups[key]) {
        groups[key] = [];
      }

      groups[key].push(work);

    });


    normalWorks.forEach((work) => {

      const key =
        work.score.toFixed(1);

      const group =
        groups[key];

      const index =
        group.indexOf(work);

      const count =
        group.length;

      const spacing = 18;

      const offset =
        (index - (count - 1) / 2)
        * spacing;

      createTimelinePoint(
        work,
        offset
      );

    });


    /*
      パロディは線から外す
    */

    works
      .filter((work) => work.parody)
      .forEach((work) => {

        createTimelinePoint(
          work,
          0
        );

      });


    function createTimelinePoint(
      work,
      offset
    ) {

      const point =
        document.createElement("div");

      point.className =
        "story-point";

      if (work.parody) {

        point.classList.add("parody");

        point.classList.add(
          work.parodyPosition === "top"
            ? "parody-top"
            : "parody-bottom"
        );

      }

      /*
        左右に少し余白を持たせながら
        0〜10を配置
      */

      const x =
        3 + (work.score / 10) * 94;

      point.style.setProperty(
        "--x",
        `${x}%`
      );

      if (!work.parody) {

        point.style.setProperty(
          "--offset",
          `${offset}px`
        );

      }

      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "point-button";

      button.setAttribute(
        "aria-label",
        work.title
      );


      const popup =
        document.createElement("div");

      popup.className =
        "story-popup";


      const title =
        document.createElement("p");

      title.className =
        "story-title";

      title.textContent =
        work.title;


      const date =
        document.createElement("p");

      date.className =
        "story-date";

      date.textContent =
        work.date;


      const detail =
        document.createElement("p");

      detail.className =
        "story-detail";

      detail.textContent =
        work.detail;


      const link =
        document.createElement("a");

      link.className =
        "story-link";

      link.href =
        work.href;

      link.textContent =
        "読む";


      popup.append(
        title,
        date,
        detail,
        link
      );

      point.append(
        button,
        popup
      );

      timeline.appendChild(point);


      /*
        スマホでは点をタップして開閉
      */

      button.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          document
            .querySelectorAll(".story-point.open")
            .forEach((otherPoint) => {

              if (otherPoint !== point) {
                otherPoint
                  .classList
                  .remove("open");
              }

            });

          point
            .classList
            .toggle("open");

        }
      );

    }


    /*
      ===================================
      執筆順
      ===================================
    */

    const writingOrder =
      document.getElementById(
        "writing-order"
      );

    const dateOrder = [
      "2023年夏",
      "2023年秋",
      "2024年冬〜春",
      "2024年春",
      "2025年冬",
      "2026年冬",
      "2026年春",
      "2026年夏",
      "2026年秋",
      "時期未記載"
    ];


    dateOrder.forEach((dateName) => {

      const dateWorks =
        works.filter(
          (work) =>
            work.date === dateName
        );

      if (dateWorks.length === 0) {
        return;
      }


      const block =
        document.createElement("section");

      block.className =
        "year-block";


      const heading =
        document.createElement("h2");

      heading.className =
        "year-title";

      heading.textContent =
        dateName;


      const list =
        document.createElement("ul");

      list.className =
        "work-list";


      dateWorks.forEach((work) => {

        const item =
          document.createElement("li");


        const link =
          document.createElement("a");

        link.href =
          work.href;

        link.textContent =
          work.title;


        item.appendChild(link);


        if (work.parody) {

          const type =
            document.createElement("span");

          type.className =
            "work-type";

          type.textContent =
            "パロディ";

          item.appendChild(type);

        }


        list.appendChild(item);

      });


      block.append(
        heading,
        list
      );

      writingOrder.appendChild(block);

    });


    /*
      ===================================
      小ウィンドウを閉じる
      ===================================
    */

    document.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".story-point.open")
          .forEach((point) => {

            point
              .classList
              .remove("open");

          });

      }
    );


    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {

          document
            .querySelectorAll(".story-point.open")
            .forEach((point) => {

              point
                .classList
                .remove("open");

            });

        }

      }
    );

  </script>

</body>
</html>
