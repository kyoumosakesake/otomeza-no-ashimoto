<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地獄楽（佐杠・杠佐）｜乙女座の脚元</title>
<style>
/* 基本設定 */
* {
  box-sizing: border-box;
}
:root {
  --background: #1d3652;
  --accent: #28bfb0;
  --white: #ffffff;
}
body {
  margin: 0;
  background: var(--background);
  color: var(--white);
  font-family: "Yu Mincho", "游明朝", "YuMincho", serif;
}
button, a {
  font-family: inherit;
}
.page {
  width: min(1200px, 94%);
  margin: 0 auto;
  padding: 4rem 0 5rem;
}
.page-title {
  margin: 0 0 2.5rem;
  text-align: center;
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: .12em;
}

/* タブ */
.tabs {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-bottom: 2.5rem;
}
.tab-button {
  padding: .5rem .2rem;
  background: transparent;
  color: var(--white);
  border: none;
  border-bottom: 1px solid transparent;
  font-size: 1.1rem;
  cursor: pointer;
  opacity: .55;
  transition: opacity .2s, border-color .2s;
}
.tab-button.active {
  opacity: 1;
  border-bottom-color: var(--accent);
}
.tab-button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 5px;
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}

/* 凡例 */
.legend {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: .8rem 1.5rem;
  margin-bottom: 1rem;
  font-size: .8rem;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  white-space: nowrap;
}
.legend-dot {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--white);
  flex-shrink: 0;
}
.legend-dot.parody {
  background: transparent;
  border: 2px solid var(--white);
}
.legend-item.latest-legend {
  color: var(--accent);
}
.latest-legend-dots {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.legend-dot.latest-filled {
  background: var(--accent);
}
.legend-dot.latest-outline {
  background: transparent;
  border: 2px solid var(--accent);
}

/* 関係性タイムライン */
.timeline-area {
  position: relative;
  --timeline-top-space: 18rem; /* JavaScriptで画面高に合わせて調整 */
}
.timeline-scroll {
  position: relative;
  overflow-x: auto;
  overflow-y: hidden;
  padding: var(--timeline-top-space) 1rem 1.5rem;
  scrollbar-color: rgba(255,255,255,.25) transparent;
  -webkit-overflow-scrolling: touch;
}
.timeline {
  position: relative;
  width: 4200px;
  height: 300px;
  margin: 0 auto;
}
.timeline-line {
  position: absolute;
  left: 55px;
  right: 0;
  top: 210px;
  height: 7px;
  background: var(--accent);
  border-radius: 999px;
  z-index: 1;
}
.slide-guide-text {
  position: absolute;
  left: 55px;
  top: calc(var(--timeline-top-space) + 192px);
  color: var(--accent);
  font-size: .8rem;
  letter-spacing: .08em;
  white-space: nowrap;
  z-index: 10;
}
/* 矢印の先端側へ線が突き抜けないよう、中央より右を背景で隠す */
.timeline-area::after {
  content: "";
  position: absolute;
  right: 0;
  top: calc(var(--timeline-top-space) + 210px);
  width: 40px;
  height: 7px;
  background: var(--background);
  pointer-events: none;
  z-index: 80;
}
.fixed-arrow-head {
  position: absolute;
  right: 28px;
  top: calc(var(--timeline-top-space) + 199px);
  width: 0;
  height: 0;
  border-top: 15px solid transparent;
  border-bottom: 15px solid transparent;
  border-left: 25px solid var(--accent);
  pointer-events: none;
  z-index: 100;
}

/* 区分 */
.division-line {
  position: absolute;
  top: 90px;
  height: 170px;
  width: 1px;
  background: rgba(255,255,255,.25);
  z-index: 0;
}
.division-1 {
  left: 40%;
}
.division-2 {
  left: 80%;
}
.current-section-label {
  position: absolute;
  top: calc(var(--timeline-top-space) + 250px);
  left: 50%;
  transform: translateX(-50%);
  font-size: .86rem;
  letter-spacing: .08em;
  opacity: .65;
  white-space: nowrap;
  pointer-events: none;
  z-index: 20;
}

/* 作品ポイント */
.story-point {
  position: absolute;
  left: var(--x);
  top: calc(210px + var(--offset, -54px));
  transform: translate(-50%, -50%);
  z-index: 5;
}
.point-button {
  display: grid;
  place-items: center;
  text-align: center;
  vertical-align: middle;
  width: 38px;
  height: 38px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--white);
  color: var(--background);
  font-size: calc(.82rem + 6px);
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.16);
  transition:
    transform .15s,
    background .15s,
    color .15s;
}
.point-button:hover,
.point-button:focus-visible,
.point-button[aria-expanded="true"] {
  background: var(--accent);
  color: var(--white);
  transform: scale(1.12);
  outline: none;
}

/* パロディ */
.story-point.parody .point-button {
  background: var(--background);
  color: var(--white);
  border: 2px solid var(--white);
}
.story-point.parody .point-button:hover,
.story-point.parody .point-button:focus-visible,
.story-point.parody .point-button[aria-expanded="true"] {
  border-color: var(--accent);
  color: var(--accent);
}

/* 最新の小説 */
.story-point.latest .point-button {
  background: var(--accent);
  color: var(--background);
}
.story-point.latest.parody .point-button {
  background: var(--background);
  color: var(--accent);
  border: 2px solid var(--accent);
}
.story-point.latest .point-button:hover,
.story-point.latest .point-button:focus-visible,
.story-point.latest .point-button[aria-expanded="true"] {
  transform: scale(1.15);
}

/* ポップアップ */
.story-popup {
  position: fixed;
  width: 265px;
  max-width: calc(100vw - 24px);
  max-height: calc(100dvh - 24px);
  box-sizing: border-box;
  overflow-y: auto;
  padding: 1.15rem 1.1rem 1rem;
  background: var(--white);
  color: var(--background);
  border-radius: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
  z-index: 999999;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s, visibility .15s;
  text-align: left;
}
.story-popup.open {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}
.popup-close {
  position: absolute;
  top: 7px;
  right: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  padding: 0;
  background: transparent;
  border: none;
  color: var(--background);
  font-family: sans-serif;
  font-size: 23px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  opacity: .55;
}
.popup-close:hover,
.popup-close:focus-visible {
  opacity: 1;
  outline: none;
}
.story-title {
  margin: 0 28px .45rem 0;
  font-size: 1.08rem;
  font-weight: 600;
  line-height: 1.5;
}
.story-date {
  margin: 0 0 .25rem;
  font-size: .79rem;
  line-height: 1.5;
  opacity: .6;
}
.story-characters {
  margin: 0 0 .7rem;
  font-size: .79rem;
  line-height: 1.5;
  opacity: .6;
}
.story-detail {
  margin: 0 0 .85rem;

  line-height: 1.7;
}
.story-link {
  display: inline-block;

/* 執筆順 */
.writing-order {

.year-block {

}
.year-title {
  margin: 0 0 1.3rem;

  letter-spacing: .12em;

}
.work-list {

}
.work-list li {

}
.work-date {
  flex: 0 0 215px;
  font-size: .82rem;

}
.work-info {

}
.work-list a {

/* 執筆順：作品行のどこを押しても作品情報を表示 */
.work-list li { cursor: pointer; }

/* 執筆順のポップアップは既に一覧にある日付・文字数を省略 */
.story-popup.writing-popup .story-date,
.story-popup.writing-popup .story-characters { display: none !important; }
.work-list .work-trigger {

  display: inline;
  width: fit-content;

  margin: 0;
  padding: 0;

}
.work-list .work-trigger:hover { opacity: .65; }
.work-list .work-trigger:focus-visible {

}
.work-meta {

}
.work-type {

}

/* 戻る */
.back-link {

/* スマートフォン */
@media (max-width: 600px) {

  .point-button {
    width: 50px;

    font-size: calc(.95rem + 6px);
  }
  .story-popup {
    width: 240px;
  }
  .latest-work-card {
    padding: 1.3rem 1.4rem;
  }
  .work-list li {
    align-items: flex-start;
    flex-direction: column;
    gap: .35rem;
  }
  .work-date {
    flex: none;
  }
}

/* ブックマーク：関係性は●の右上に星を重ねる */
.story-point.bookmarked .point-button::after {
  content: "★";
  position: absolute;
  top: -11px;
  right: -11px;
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--background);
  border: 1px solid var(--accent);
  color: var(--accent);

  pointer-events: none;
}

/* 執筆順：作品名の右側に星を表示 */
.work-list li.bookmarked .work-info {
  position: relative;
  padding-right: 24px;
}
.work-list li.bookmarked .work-info::before {
  content: "★";
  position: absolute;
  top: 1px;
  left: calc(100% + 8px);
  color: var(--accent);
  font: 14px/1 sans-serif;
  pointer-events: none;
}
.latest-work-card.bookmarked {
  position: relative;
}
.latest-work-card.bookmarked::before {
  content: "★";
  position: absolute;
  top: 10px;
  right: 12px;
  color: var(--background);
  font: 16px/1 sans-serif;
  pointer-events: none;
}
</style>

<script>
/* reader.html と共通のブックマーク情報を表示する */
const bookmarkStorageKey = "otomeza-bookmarked-works-v1";

function getBookmarkedIds() {
  try {
    const data = JSON.parse(
      localStorage.getItem(bookmarkStorageKey) || "[]"
    );
    return new Set(Array.isArray(data) ? data : []);
  } catch (_) {
    return new Set();
  }
}

function bookmarkIdForWork(work) {
  try {
    return new URL(work.href, location.href)
      .searchParams.get("work");
  } catch (_) {
    return null;
  }
}

function refreshBookmarkMarks() {
  const ids = getBookmarkedIds();
  document.querySelectorAll("[data-bookmark-id]").forEach(element => {
    element.classList.toggle(
      "bookmarked",
      ids.has(element.dataset.bookmarkId)
    );
  });
}

window.addEventListener("pageshow", refreshBookmarkMarks);
window.addEventListener("storage", event => {
  if (event.key === bookmarkStorageKey) {
    refreshBookmarkMarks();
  }
});

/* 作品データ
   characters: novels.js の本文から自動計算（空白・改行を除く）。
   latest: 最新作のみ true にします。
*/
/* 作品情報は novels.js で一元管理。新作は novels.js に追加するだけで反映されます。 */
const originalWorkOrder = [
  "yawarakana-hibiki",
  "anata-no-kokoro",
  "kokoro-wo-furuwaseru-yobi",
  "heart-no-kiki",
  "watashi-no-sweets",
  "kawaneba-son",
  "arinomamade",
  "zawatsuki",
  "sokoku-no-ai",
  "midashi-mitasu-mono",
  "tomo-ni-sugosu-jikan",
  "yuraku-wo-shiru-wa",
  "te-ni-shitai-hikari",
  "sono-kokoro-mitasareru-made",
  "fuan-wo-tachikitte",
  "i-am-too-happy",
  "blue-green",
  "yoigatari",
  "fude-ga-suberu",
  "otagaisama",
  "hito-wo-miru-hito-yo",
  "aragai-ikigai",
  "usotsuki-no-honne",
  "yogo-kyoyu",
  "tokete-shimau-kurai",
  "massugu-na-kusemono",
  "gendo-made-murasarete",
  "anata-no-kokoro-wo-ajiwaitai",
  "marumochi-futatsu",
  "futari-te-wo-tsunaidara",
  "tada-soba-ni",
  "kaze-no-komyo",
  "mata-susumu-tame",
  "shinoburedo",
  "hitotsume-no-habataki",
  "maemuki-ni-susumu",
  "tashikana-iro-no-aru-sekai",
  "fukuramu-temiyage",
  "himegoto-wa-mukougawa-ni",
  "hana-wa-chiru-yue-ni",
  "me-too",
  "yume-no-tsuzuki-wa",
  "yukionna-oni",
  "oikakekko",
  "koi-wo-naku-niwa",
  "sei-ni-okasare",
  "saikai-no-yoru",
  "tabi-wa-michizure"
];
const originalOrderIndex = new Map(originalWorkOrder.map((id, index) => [id, index]));
const works = (typeof novels !== "undefined" ? novels : []).map((novel, index) => ({
  title: novel.title,
  date: novel.date || "",
  ...(novel.endDate ? { endDate: novel.endDate } : {}),
  characters: null,
  detail: novel.detail || "",
  score: Number.isFinite(Number(novel.score)) ? Number(novel.score) : 5.0,
  ...(novel.parody ? { parody: true } : {}),
  href: `reader.html?work=${encodeURIComponent(novel.id)}`,
  _order: originalOrderIndex.has(novel.id) ? originalOrderIndex.get(novel.id) : originalWorkOrder.length + index
})).sort((a, b) => a._order - b._order);
/* 最新作は執筆日から自動判定（同日の場合は novels.js の登録順を優先）。 */
const latestDate = works.reduce((latest, work) => work.date > latest ? work.date : latest, "");
const latestWorkId = [...works].reverse().find(work => work.date === latestDate)?.href;
works.forEach(work => { work.latest = work.href === latestWorkId; });

/* novels.js の本文から文字数を自動計算します。
   空白（全角・半角）・改行・タブは数えず、句読点や記号は数えます。
   Unicode の文字単位で数えるため、絵文字なども適切に扱います。 */
const novelTextById = new Map(
  (typeof novels !== "undefined" ? novels : []).map(novel => [novel.id, novel.text])
);

works.forEach(work => {
  const workId = new URL(work.href, window.location.href).searchParams.get("work");
  const text = novelTextById.get(workId);
  if (typeof text === "string") {
    work.characters = Array.from(text.replace(/\s/g, "")).length;
  } else {
    // 本文が見つからない場合、仮の999字を表示しません。
    work.characters = null;
    console.warn("文字数を計算できませんでした:", work.title, workId);
  }
});

/* 執筆日・文字数の表示 */
works.forEach((work, index) => {
  work.originalIndex = index;
});

const chronologicalWorks = [...works].sort((a, b) =>
  a.date.localeCompare(b.date) ||
  a.originalIndex - b.originalIndex
);

function displayDate(work) {
  return work.endDate
    ? `${work.date} ～ ${work.endDate}`
    : work.date;
}

function displayCharacters(work) {
  if (
    work.characters === undefined ||
    work.characters === null
  ) {
    return "";
  }
  return `${Number(work.characters).toLocaleString("ja-JP")}字`;
}

/* 最新作の取得 */
const latestWork =
  works.find(work => work.latest === true);

/* ポップアップ */
const popup =
  document.getElementById("story-popup");
const popupClose =
  document.getElementById("popup-close");
const popupTitle =
  document.getElementById("popup-title");
const popupDate =
  document.getElementById("popup-date");
const popupCharacters =
  document.getElementById("popup-characters");
const popupDetail =
  document.getElementById("popup-detail");
const popupLink =
  document.getElementById("popup-link");

let activePoint = null;
let activeButton = null;

/* ポップアップの位置 */
function positionPopup(button) {
  const rect =
    button.getBoundingClientRect();

  const popupWidth =
    popup.offsetWidth;
  const popupHeight =
    popup.offsetHeight;

  const margin = 12;
  const gap = 12;

  // 執筆順：画面右端と作品行の下端をそれぞれ揃える。
  // タイトルボタンではなく、行全体の位置を基準にする。
  if (button.classList.contains("work-trigger")) {
    const row = button.closest(".work-list li");
    const rowRect = row ? row.getBoundingClientRect() : rect;
    // PCでは最新作カード（.writing-order）の右端にポップアップの右端を揃える。
    // 高さ・縦位置はこれまでどおり、選択した作品行の下端を基準にする。
    if (window.matchMedia("(min-width: 601px)").matches) {
      const listRect = writingOrder.getBoundingClientRect();
      popup.style.left = `${Math.max(margin, listRect.right - popupWidth)}px`;
    } else {
      popup.style.left = `${window.innerWidth - popupWidth}px`;
    }
    popup.style.top = `${rowRect.bottom - popupHeight}px`;
    return;
  }

  let left =
    rect.left +
    rect.width / 2 -
    popupWidth / 2;

  let top =
    rect.top -
    popupHeight -
    gap;

  left = Math.max(
    margin,
    Math.min(
      left,
      window.innerWidth - popupWidth - margin
    )
  );

  if (top < margin) {
    top = rect.bottom + gap;
  }

  if (
    top + popupHeight >
    window.innerHeight - margin
  ) {
    top =
      window.innerHeight -
      popupHeight -
      margin;
  }

  top = Math.max(margin, top);

  popup.style.left = `${left}px`;
  popup.style.top = `${top}px`;
}

/* ポップアップを開く */
function openPopup(work, point, button, tab = "timeline") {
  closePopup();

  popup.classList.toggle("writing-popup", tab === "writing");

  popupTitle.textContent =
    work.title;
  popupDate.textContent =
    displayDate(work);

  const characters =
    displayCharacters(work);

  popupCharacters.textContent =
    characters;

  popupCharacters.style.display =
    characters ? "block" : "none";

  popupDetail.textContent =
    work.detail;
  popupLink.href =
    work.href;
  popupLink.onclick = () => rememberOpenedWork(work, tab);

  activePoint = point;
  activeButton = button;

  button.setAttribute(
    "aria-expanded",
    "true"
  );

  popup.classList.add("open");
  popup.setAttribute(
    "aria-hidden",
    "false"
  );

  positionPopup(button);
}

/* ポップアップを閉じる */
function closePopup() {
  popup.classList.remove("open");
  popup.setAttribute(
    "aria-hidden",
    "true"
  );

  if (activeButton) {
    activeButton.setAttribute(
      "aria-expanded",
      "false"
    );
  }

  activePoint = null;
  activeButton = null;
}

/* ×ボタン */
popupClose.addEventListener("click", event => {
  event.stopPropagation();
  closePopup();
});

/* ポップアップの外側 */
document.addEventListener("click", event => {
  if (
    !event.target.closest(".story-popup") &&
    !event.target.closest(".point-button") &&
    !event.target.closest(".work-list li")
  ) {
    closePopup();
  }
});

/* Escapeキー */
document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closePopup();
  }
});

/* タブ切り替え */
const tabButtons =
  document.querySelectorAll(".tab-button");
const tabContents =
  document.querySelectorAll(".tab-content");

tabButtons.forEach(button => {
  button.addEventListener("click", () => {
    closePopup();

    tabButtons.forEach(item => {
      item.classList.remove("active");
      item.setAttribute("aria-selected", "false");
    });

    tabContents.forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    button.setAttribute(
      "aria-selected",
      "true"
    );

    document
      .getElementById(button.dataset.tab)
      .classList.add("active");

    if (button.dataset.tab === "timeline-tab") {
      requestAnimationFrame(() => {
        adjustTimelineHeight();
        updateSectionLabel();
      });
    }
  });
});

/* 関係性タイムライン */
const timeline =
  document.getElementById("timeline");

const groups = {};

works.forEach(work => {
  const key = work.score.toFixed(1);

  if (!groups[key]) {
    groups[key] = [];
  }

  groups[key].push(work);
});

Object.values(groups).forEach(group => {
  group.sort((a, b) =>
    a.date.localeCompare(b.date) ||
    a.originalIndex - b.originalIndex
  );
});

works.forEach(work => {
  const group =
    groups[work.score.toFixed(1)];

  const index =
    group.indexOf(work);

  const offset =
    -58 - ((group.length - 1 - index) * 52);

  createTimelinePoint(work, offset);
});

/* 作品ポイント生成 */
function createTimelinePoint(work, offset) {
  const point =
    document.createElement("div");

  point.className = "story-point";
  point.dataset.bookmarkId = bookmarkIdForWork(work) || "";

  if (work.parody) {
    point.classList.add("parody");
  }

  if (work.latest) {
    point.classList.add("latest");
  }

  const x =
    8 +
    ((work.score - 2.5) / (9.6 - 2.5)) * 89.5;

  point.style.setProperty(
    "--x",
    `${x}%`
  );

  point.style.setProperty(
    "--offset",
    `${offset}px`
  );

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "point-button";

  button.setAttribute(
    "aria-label",
    work.title
  );

  button.setAttribute(
    "aria-expanded",
    "false"
  );

  button.textContent =
    Array.from(work.title)[0];

  point.appendChild(button);
  timeline.appendChild(point);

  button.addEventListener("click", event => {
    event.stopPropagation();

    if (activePoint === point) {
      closePopup();
      return;
    }

    openPopup(work, point, button);
  });
}

/* 執筆順 */
const writingOrder =
  document.getElementById("writing-order");

/* 最新作カード */
if (latestWork) {
  const card =
    document.createElement("a");

  card.className = "latest-work-card";
  card.dataset.bookmarkId = bookmarkIdForWork(latestWork) || "";
  card.href = latestWork.href;
  card.addEventListener("click", () => rememberOpenedWork(latestWork, "writing"));

  const label =
    document.createElement("p");

  label.className = "latest-card-label";
  label.textContent = "最新の小説";

  const date =
    document.createElement("p");

  date.className = "latest-card-date";
  date.textContent =
    displayDate(latestWork);

  const title =
    document.createElement("h2");

  title.className = "latest-card-title";
  title.textContent =
    latestWork.title;

  const characters =
    document.createElement("p");

  characters.className =
    "latest-card-characters";

  characters.textContent =
    displayCharacters(latestWork);

  if (!displayCharacters(latestWork)) {
    characters.style.display = "none";
  }

  const detail =
    document.createElement("p");

  detail.className = "latest-card-detail";
  detail.textContent =
    latestWork.detail;

  card.append(
    label,
    date,
    title,
    characters,
    detail
  );

  writingOrder.appendChild(card);
}

/* 年ごとの作品一覧 */
const years = [
  ...new Set(
    chronologicalWorks.map(work =>
      work.date.slice(0, 4)
    )
  )
];

years.forEach(year => {
  const block =
    document.createElement("section");

  block.className = "year-block";

  const heading =
    document.createElement("h2");

  heading.className = "year-title";
  heading.textContent = `${year}年`;

  const list =
    document.createElement("ul");

  list.className = "work-list";

  chronologicalWorks
    .filter(work => work.date.startsWith(year))
    .forEach(work => {
      const item =
        document.createElement("li");

      item.dataset.bookmarkId = bookmarkIdForWork(work) || "";

      const date =
        document.createElement("span");

      date.className = "work-date";
      date.textContent =
        displayDate(work);

      const info =
        document.createElement("div");

      info.className = "work-info";

      const link =
        document.createElement("button");

      link.type = "button";
      link.className = "work-trigger";
      link.setAttribute("aria-haspopup", "dialog");
      link.setAttribute("aria-expanded", "false");
      link.setAttribute("aria-controls", "story-popup");
      link.textContent = work.title;
      // 行全体をタップ領域にする（タイトルのボタンはキーボード操作にも対応）。
      const toggleWritingPopup = event => {
        event.stopPropagation();
        // 開いている間は他作品に直接切り替えず、まず閉じる。
        // 同じ行の再タップも、ボックス外のタップとして閉じる。
        if (popup.classList.contains("open")) {
          closePopup();
          return;
        }
        openPopup(work, item, link, "writing");
      };
      item.addEventListener("click", toggleWritingPopup);

      const meta =
        document.createElement("div");

      meta.className = "work-meta";

      const characters =
        document.createElement("span");

      characters.className =
        "work-characters";

      characters.textContent =
        displayCharacters(work);

      if (displayCharacters(work)) {
        meta.appendChild(characters);
      }

      if (work.parody) {
        const type =
          document.createElement("span");

        type.className = "work-type";
        type.textContent = "パロディ";

        meta.appendChild(type);
      }

      info.appendChild(link);

      if (meta.children.length > 0) {
        info.appendChild(meta);
      }

      item.append(
        date,
        info
      );

      list.appendChild(item);
    });

  block.append(
    heading,
    list
  );

  writingOrder.appendChild(block);
});

/* タイムラインの区分名 */
const timelineScroll =
  document.querySelector(".timeline-scroll");

const currentSectionLabel =
  document.getElementById("current-section-label");

const division1 =
  document.querySelector(".division-1");

const division2 =
  document.querySelector(".division-2");

/* 凡例（本編・パロディ・最新の小説）の位置は変えず、
   下の区分名が画面の上から約85%に来るように余白を調整。 */
function adjustTimelineHeight() {
  const area = document.querySelector(".timeline-area");
  if (!area || !document.getElementById("timeline-tab").classList.contains("active")) return;
  const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const areaTop = area.getBoundingClientRect().top;
  // 区分名はタイムラインの上余白 + 250px の位置に表示されます。
  const desiredSpace = viewportHeight * 0.85 - areaTop - 250;
  // 作品ポイントが上部で見切れないよう最低限の余白を確保します。
  const minSpace = window.matchMedia("(max-width: 600px)").matches ? 70 : 100;
  const space = Math.max(minSpace, Math.min(340, desiredSpace));
  area.style.setProperty("--timeline-top-space", `${space}px`);
}

function updateSectionLabel() {
  const timelineRect =
    timeline.getBoundingClientRect();

  const scrollRect =
    timelineScroll.getBoundingClientRect();

  const centerX =
    scrollRect.left +
    scrollRect.width / 2 -
    timelineRect.left;

  if (centerX >= division2.offsetLeft) {
    currentSectionLabel.textContent =
      "その後";
  } else if (centerX >= division1.offsetLeft) {
    currentSectionLabel.textContent =
      "諸国行脚";
  } else {
    currentSectionLabel.textContent =
      "仙薬捜索";
  }
}

/* スクロール時 */
timelineScroll.addEventListener(
  "scroll",
  () => {
    updateSectionLabel();
    closePopup();
  },
  { passive: true }
);

/* 画面サイズ変更時 */
window.addEventListener("resize", () => {
  adjustTimelineHeight();
  updateSectionLabel();

  if (activeButton) {
    positionPopup(activeButton);
  }
});

/* ページ縦スクロール時 */
window.addEventListener(
  "scroll",
  () => {
    closePopup();
  },
  { passive: true }
);

/* 画像の位置に合わせ、「嘘つきの本音」を画面左から約24％に配置。
   数直線自体は切り詰めず、左右どちらにもスクロールできます。 */
function setInitialTimelinePosition() {
  const target = [...timeline.querySelectorAll(".story-point .point-button")]
    .find(button => button.getAttribute("aria-label") === "嘘つきの本音");
  const maxScroll = Math.max(0, timelineScroll.scrollWidth - timelineScroll.clientWidth);
  if (target) {
    const point = target.closest(".story-point");
    const timelineOffset = timeline.offsetLeft;
    const desiredX = timelineScroll.clientWidth * 0.24;
    timelineScroll.scrollLeft = Math.max(0, Math.min(maxScroll,
      timelineOffset + point.offsetLeft - desiredX));
  }
  updateSectionLabel();
}


/* 小説本文から戻る際のタブ・作品位置を記録する。 */
const readingReturnKey = "otomeza-fanworks-return-v1";
function rememberOpenedWork(work, tab) {
  const id = bookmarkIdForWork(work);
  if (!id) return;
  try {
    sessionStorage.setItem(readingReturnKey, JSON.stringify({
      id, tab, timestamp: Date.now(), pending: true
    }));
  } catch (_) { /* 保存不可でも通常のリンクは利用できる */ }
}
function showFanworksTab(tab) {
  const tabId = tab === "writing" ? "writing-tab" : "timeline-tab";
  tabButtons.forEach(button => {
    const active = button.dataset.tab === tabId;
    button.classList.toggle("active", active);
    button.setAttribute("aria-selected", String(active));
  });
  tabContents.forEach(content => {
    content.classList.toggle("active", content.id === tabId);
  });
  if (tabId === "timeline-tab") {
    adjustTimelineHeight();
    updateSectionLabel();
  }
}
function getReturnState() {
  // 「作品一覧に戻る」リンクはURLを優先。
  const params = new URLSearchParams(location.search);
  if (params.get("from") === "reader") {
    const id = params.get("work");
    const tab = params.get("tab");
    if (id && ["timeline", "writing"].includes(tab)) return { id, tab };
  }

  // ブラウザの「戻る」ではURLが変わらないので、
  // 本文へ移動する直前に記録した作品を使う。
  try {
    const state = JSON.parse(sessionStorage.getItem(readingReturnKey) || "null");
    if (state && state.pending === true &&
        typeof state.id === "string" &&
        ["timeline", "writing"].includes(state.tab) &&
        Date.now() - state.timestamp < 2 * 60 * 60 * 1000) {
      return state;
    }
  } catch (_) {}
  return null;
}
function clearPendingReturn() {
  try {
    const state = JSON.parse(sessionStorage.getItem(readingReturnKey) || "null");
    if (state && state.pending) {
      state.pending = false;
      sessionStorage.setItem(readingReturnKey, JSON.stringify(state));
    }
  } catch (_) {}
}
function restoreOpenedWork(state) {
  if (!state) return false;
  const { id, tab } = state;
  showFanworksTab(tab);
  if (tab === "timeline") {
    const point = [...timeline.querySelectorAll(".story-point")]
      .find(el => el.dataset.bookmarkId === id);
    if (point) {
      const pointCenter = point.getBoundingClientRect().left + point.getBoundingClientRect().width / 2;
      const viewportCenter = timelineScroll.getBoundingClientRect().left + timelineScroll.clientWidth / 2;
      timelineScroll.scrollLeft += pointCenter - viewportCenter;
      updateSectionLabel();
    }
  } else {
    const row = [...writingOrder.querySelectorAll("[data-bookmark-id]")]
      .find(el => el.dataset.bookmarkId === id && el.tagName === "LI")
      || [...writingOrder.querySelectorAll("[data-bookmark-id]")]
      .find(el => el.dataset.bookmarkId === id);
    if (row) {
      const top = window.scrollY + row.getBoundingClientRect().top +
        row.getBoundingClientRect().height / 2 - window.innerHeight / 2;
      window.scrollTo({ top: Math.max(0, top), behavior: "instant" });
    }
  }
  return true;
}
function restoreOnReturn(state) {
  if (state) {
    restoreOpenedWork(state);
    requestAnimationFrame(() => restoreOpenedWork(state));
    return;
  }
  setInitialTimelinePosition();
}

/* 初期表示。本文から戻った場合だけ作品位置を復元する。 */
const initialReturnState = getReturnState();
adjustTimelineHeight();
restoreOnReturn(initialReturnState);
window.addEventListener("load", () => {
  adjustTimelineHeight();
  restoreOnReturn(initialReturnState);
  if (initialReturnState) clearPendingReturn();
});
window.addEventListener("pageshow", event => {
  if (event.persisted) {
    refreshBookmarkMarks();
    adjustTimelineHeight();
    const state = getReturnState();
    if (state) {
      restoreOnReturn(state);
      clearPendingReturn();
    }
  }
});
if (window.visualViewport) window.visualViewport.addEventListener("resize", adjustTimelineHeight);
refreshBookmarkMarks();
</script>
