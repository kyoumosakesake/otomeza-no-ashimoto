<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記事｜カラスのアルキバ</title><link rel="stylesheet" href="archive.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script></head>
<body><main class="shell"><nav class="top"><a href="archive.html">← カラスのアルキバ</a><span>乙女座の脚元</span></nav><header class="article-head"><h1 class="article-title" id="title">読み込み中……</h1><div class="article-meta" id="date"></div></header>
<div class="toolbar"><button class="btn active" id="vertical">縦書き</button><button class="btn" id="horizontal">横書き</button><button class="btn active" id="mincho">明朝</button><button class="btn" id="gothic">ゴシック</button><label>文字 <input id="size" type="range" min="0" max="4" step="1" value="2"><span id="size-text">19px</span></label></div>
<div class="reader-frame"><article class="reader vertical" id="reader"></article></div><p class="status" id="status"></p></main>
<script type="module">
import {db,esc,dateText,safeHTML,hydrateImages} from './archive-common.js';import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=s=>document.querySelector(s),reader=$('#reader'), sizes=[15,17,19,21,23];
function choose(group,chosen){for(const id of group)$('#'+id).classList.toggle('active',id===chosen);}
function apply(){const mode=localStorage.getItem('karasu-writing')||'vertical',font=localStorage.getItem('karasu-font')||'mincho',idx=Math.min(4,Math.max(0,Number(localStorage.getItem('karasu-size')??2)));reader.classList.toggle('vertical',mode==='vertical');reader.classList.toggle('gothic',font==='gothic');reader.style.fontSize=sizes[idx]+'px';$('#size').value=idx;$('#size-text').textContent=sizes[idx]+'px';choose(['vertical','horizontal'],mode);choose(['mincho','gothic'],font);}
for(const id of ['vertical','horizontal'])$('#'+id).onclick=()=>{localStorage.setItem('karasu-writing',id);apply();};for(const id of ['mincho','gothic'])$('#'+id).onclick=()=>{localStorage.setItem('karasu-font',id);apply();};$('#size').oninput=e=>{localStorage.setItem('karasu-size',e.target.value);apply();};apply();
const id=new URLSearchParams(location.search).get('id');if(!id){$('#title').textContent='記事が見つかりません';}else{try{const snap=await getDoc(doc(db,'posts',id));if(!snap.exists()||snap.data().status!=='published'){throw new Error('not found');}const p=snap.data();$('#title').textContent=p.title?.trim()||'無題';document.title=$('#title').textContent+'｜カラスのアルキバ';$('#date').textContent='記録日 '+dateText(p.recordDate)+(p.updatedAt&&p.publishedAt&&p.updatedAt.toMillis()>p.publishedAt.toMillis()+60000?' · 更新 '+p.updatedAt.toDate().toLocaleDateString('ja-JP'):'');reader.innerHTML=safeHTML(p.body);await hydrateImages(reader);}catch(e){console.error(e);$('#title').textContent='記事を表示できません';$('#status').textContent='記事が非公開になったか、読み込みに失敗しました。';}}
</script></body></html>
