<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>交信管理｜乙女座の脚元</title><link rel="stylesheet" href="koushin.css"></head><body><main class="shell"><nav class="nav"><a href="koushin.html">← 交信</a><span>管理者専用</span></nav><header class="hero"><div class="symbol">✦ · ✦</div><h1>交信管理</h1><p>届いた言葉を、静かに読む。</p></header><section class="panel"><p id="status" class="status" role="status" aria-live="polite">ログイン状態を確認しています……</p><section id="login" hidden><form id="login-form"><label class="field">メールアドレス<input id="email" type="email" autocomplete="username" required></label><label class="field">パスワード<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button class="btn primary" type="submit">ログイン</button></div></form></section><section id="dashboard" hidden><div class="actions"><button id="refresh" class="btn" type="button">更新</button><button id="logout" class="btn" type="button">ログアウト</button></div><div class="tabs" role="group" aria-label="メッセージの分類"><button class="btn tab" data-tab="unread" aria-pressed="true">未読</button><button class="btn tab" data-tab="read" aria-pressed="false">既読</button><button class="btn tab" data-tab="replied" aria-pressed="false">返信済み</button><button class="btn tab" data-tab="saved" aria-pressed="false">保管</button></div><div id="list"></div></section></section></main><script type="module">
import {db,auth,isOwner} from './archive-common.js';
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {collection,getDocs,doc,updateDoc,deleteDoc,query,orderBy} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=s=>document.querySelector(s);let entries=[],tab='unread',busy=false;const status=s=>$('#status').textContent=s;
function view(v){$('#login').hidden=v!=='login';$('#dashboard').hidden=v!=='dashboard';}
$('#login-form').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#email').value,$('#password').value);$('#password').value='';}catch(e){console.error(e);status('ログインできませんでした。');}};
$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){view('login');status('管理者としてログインしてください。');return;}if(!isOwner(user)){view('login');status('このアカウントには管理権限がありません。');await signOut(auth);return;}view('dashboard');await reload();});
async function reload(){status('読み込み中……');try{const snap=await getDocs(query(collection(db,'koushin'),orderBy('createdAt','desc')));entries=snap.docs.map(d=>({id:d.id,...d.data()}));status(`全 ${entries.length} 件の交信があります。`);render();}catch(e){console.error(e);status('読み込めませんでした。Firestoreルールをご確認ください。');}}
$('#refresh').onclick=reload;
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;for(const t of document.querySelectorAll('[data-tab]'))t.setAttribute('aria-pressed',String(t===b));render();};
function render(){const box=$('#list');box.replaceChildren();const filtered=entries.filter(m=>tab==='saved'?m.archived:!m.archived&&(tab==='unread'?!m.read:tab==='read'?m.read&&!m.reply:!!m.reply));if(!filtered.length){const p=document.createElement('p');p.className='hint';p.textContent='ここにメッセージはありません。';box.append(p);return;}for(const m of filtered){const row=document.createElement('article');row.className='admin-row';const time=document.createElement('div');time.className='meta';time.textContent=m.createdAt?.toDate?.().toLocaleString('ja-JP')||'日時未取得';const preview=document.createElement('p');preview.textContent=m.body.length>140?m.body.slice(0,140)+'…':m.body;const actions=document.createElement('div');actions.className='actions';const open=button('開く',async()=>{if(!m.read){await change(m,{read:true},false);}showDetail(m,row);});const save=button(m.archived?'保管を解除':'保管する',async()=>{await change(m,{archived:!m.archived});});const remove=button('削除',async()=>{if(!confirm('この交信を完全に削除しますか？'))return;try{await deleteDoc(doc(db,'koushin',m.id));entries=entries.filter(x=>x.id!==m.id);render();status('削除しました。');}catch(e){console.error(e);status('削除できませんでした。');}});actions.append(open,save,remove);row.append(time,preview,actions);box.append(row);}}
function button(t,fn){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=t;b.onclick=fn;return b;}
async function change(m,patch,refresh=true){if(busy)return false;busy=true;try{await updateDoc(doc(db,'koushin',m.id),patch);Object.assign(m,patch);if(refresh)render();return true;}catch(e){console.error(e);status('変更できませんでした。');return false;}finally{busy=false;}}
function showDetail(m,row){const detail=document.createElement('section');detail.className='receipt';const title=document.createElement('div');title.className='label';title.textContent='届いた言葉';const body=document.createElement('div');body.className='entry';body.textContent=m.body;detail.append(title,body);if(m.reply){const h=document.createElement('div');h.className='label';h.textContent='送信済みの返信';const p=document.createElement('div');p.className='entry';p.textContent=m.reply;detail.append(h,p);}else{const label=document.createElement('label');label.className='label';label.textContent='一度だけ返信できます';const textarea=document.createElement('textarea');textarea.className='text small';textarea.maxLength=4000;textarea.placeholder='返信を書く';const send=button('返信を送る',async()=>{const reply=textarea.value.trim();if(!reply)return;if(!confirm('この返信を送信しますか？送信後の書き直しはできません。'))return;send.disabled=true;const ok=await change(m,{reply});if(ok){status('返信を送りました。');}else send.disabled=false;});detail.append(label,textarea,send);}row.append(detail);}
</script></body></html>
