<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女座の脚元</title>

  <style>

    :root { --night:#1d3652; --teal:#28bfb0; }
    body { margin:0; min-height:100vh; background:var(--night); color:#fff; font-family:"Yu Mincho","游明朝","YuMincho",serif; }
    .hero { position:relative; min-height:100vh; min-height:100dvh; overflow:hidden; isolation:isolate; text-align:center; background:radial-gradient(ellipse at 70% 27%, #2c4964 0%, #213d59 34%, #1d3652 72%, #182e49 100%); }
    .hero::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(ellipse at 50% 100%, transparent 20%,rgba(8,19,37,.17) 100%); }
    .night-stars { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:.85; }
    .night-stars circle { fill:#d7eaf0; animation:star-glimmer 7s ease-in-out infinite; }
    .night-stars circle:nth-child(3n) { animation-delay:-2.4s; }
    .night-stars circle:nth-child(4n) { animation-delay:-4.7s; }
    @keyframes star-glimmer { 0%,100% {opacity:.3} 50% {opacity:.85} }
    .hero-heading { position:absolute; z-index:2; top:55%; left:1rem; right:1rem; transform:translateY(-50%); pointer-events:none; }
    .site-title { margin:0; color:#fff; font-size:clamp(2rem,4.2vw,3.2rem); font-weight:400; letter-spacing:.16em; opacity:0; animation:title-appear 2.1s ease-out .25s forwards; text-shadow:0 0 25px rgba(231,245,255,.10); }
    .site-description { margin:1.15rem 0 0; color:#e4edf3; font-size:clamp(.95rem,1.6vw,1.15rem); line-height:1.8; letter-spacing:.08em; min-height:1.8em; }
    .site-description.typing::after { content:""; display:inline-block; height:1em; margin-left:.12em; border-right:1px solid #28bfb0; vertical-align:-.12em; animation:caret-blink .8s step-end infinite; }
    @keyframes caret-blink { 50% { opacity:0; } }
    @keyframes title-appear { from {opacity:0; filter:blur(7px)} to {opacity:1; filter:blur(0)} }
    .open-button { position:absolute; z-index:3; top:76%; left:50%; transform:translate(-50%,-50%); display:inline-flex; align-items:center; justify-content:center; min-width:7.4rem; box-sizing:border-box; padding:.8rem 1.8rem; background:#28bfb0; color:#fff; border:1px solid rgba(202,255,250,.38); border-radius:999px; font:inherit; font-size:1.35rem; letter-spacing:.12em; text-decoration:none; box-shadow:0 0 0 rgba(40,191,176,0); transition:transform .3s ease,box-shadow .3s ease,background .3s ease; }
    .open-button::after { content:""; position:absolute; left:27%; right:27%; bottom:.42rem; height:1px; background:#eafffc; transform:scaleX(0); transition:transform .3s ease; }
    .open-button:hover { transform:translate(-50%,calc(-50% - 2px)); background:#30cdbd; box-shadow:0 0 25px rgba(40,191,176,.32); }
    .open-button:hover::after, .open-button:focus-visible::after { transform:scaleX(1); }
    .open-button:focus-visible { outline:2px solid #fff; outline-offset:4px; }
    .corvus { position:absolute; z-index:2; top:clamp(30px,8vh,95px); left:50%; width:min(320px,74vw,36vh); height:auto; aspect-ratio:546/601; transform:translateX(-50%); border:0; padding:0; background:transparent; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .corvus svg { width:100%; height:100%; display:block; overflow:visible; }
    .corvus .star-core { fill:#f2f9ff; filter:drop-shadow(0 0 3px rgba(222,243,255,.75)); transition:fill .6s ease,filter .6s ease; }
    .corvus .star-halo { fill:#d4e6f4; opacity:.10; transition:opacity .6s ease,fill .6s ease; }
    .corvus .constellation-path { fill:none; stroke:#42d9cb; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; opacity:0; stroke-dasharray:1800; stroke-dashoffset:1800; transition:opacity .45s ease,stroke-dashoffset 1.65s ease; filter:drop-shadow(0 0 3px rgba(40,191,176,.5)); }
    .corvus:is(:focus-visible,[data-active="true"]) .constellation-path { opacity:.83; stroke-dashoffset:0; }
    .corvus:is(:focus-visible,[data-active="true"]) .star-core { fill:#8df6e9; filter:drop-shadow(0 0 7px rgba(40,191,176,.9)); }
    .corvus:is(:focus-visible,[data-active="true"]) .star-halo { opacity:.33; fill:#51d9cc; }
    @media (hover:hover) and (pointer:fine) {
      .corvus:hover .constellation-path { opacity:.83; stroke-dashoffset:0; }
      .corvus:hover .star-core { fill:#8df6e9; filter:drop-shadow(0 0 7px rgba(40,191,176,.9)); }
      .corvus:hover .star-halo { opacity:.33; fill:#51d9cc; }
    }
    .corvus:focus-visible { outline:1px solid rgba(40,191,176,.6); outline-offset:4px; border-radius:8px; }
    .signal-overlay { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#1d3652; }
    .signal-overlay[hidden], .reply-notice[hidden] { display:none !important; }
    .signal-stars { display:flex; align-items:center; justify-content:center; gap:clamp(24px,6vw,68px); color:#29c5be; font-family:Georgia,serif; font-size:clamp(64px,14vw,136px); line-height:1; }
    .signal-dot { font-size:.28em; opacity:.75; }
    .signal-right { animation:signal-right-light 2s ease-in-out both; }
    @keyframes signal-right-light { 0%,100% {color:#29c5be;text-shadow:none;filter:brightness(1);transform:scale(1)} 38%,62% {color:#d3fff5;text-shadow:0 0 16px rgba(91,255,224,.9),0 0 45px rgba(57,226,207,.8),0 0 95px rgba(57,226,207,.38);filter:brightness(1.5);transform:scale(1.13)} }
    .reply-notice { position:fixed; inset:0; z-index:9998; background:#1d3652; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; box-sizing:border-box; gap:1.2rem; }
    .reply-notice h2 { font-size:clamp(1.6rem,5vw,2.2rem); font-weight:400; letter-spacing:.13em; margin:0; }
    .reply-notice p { line-height:2; margin:0; }
    .reply-notice input { width:min(520px,100%); box-sizing:border-box; background:#294560; color:white; border:1px solid #4b8d99; border-radius:4px; padding:.8rem; font:inherit; font-size:.82rem; }
    .reply-actions { display:flex; justify-content:center; gap:.8rem; flex-wrap:wrap; }
    .reply-actions a, .reply-actions button { background:#28bfb0; color:#132e45; border:1px solid #28bfb0; padding:.8rem 1.3rem; font:inherit; font-size:1rem; border-radius:4px; text-decoration:none; cursor:pointer; }
    .reply-actions button { background:transparent; color:white; border-color:#4b8d99; }
    .reply-notice .privacy { color:#b8d4dc; font-size:.83rem; max-width:36rem; }
    @media (max-width:600px) { .corvus {top:clamp(24px,6vh,65px);width:min(310px,78vw,34vh)} .hero-heading {top:57%} .site-title {letter-spacing:.1em} .open-button {top:79%;font-size:1.25rem} }
    @media (max-height:570px) { .corvus {top:2vh;width:min(240px,52vw,32vh)} .hero-heading {top:60%} .open-button {top:84%} }
    @media (prefers-reduced-motion:reduce) { .site-title {animation:none;opacity:1;filter:none} .site-description.typing::after {animation:none;opacity:0} .night-stars circle,.signal-right {animation:none} .constellation-path,.corvus .star-core,.corvus .star-halo,.corvus .corvus-name {transition:none} }
  </style>
</head>

<body>

  <main class="hero">
    <svg class="night-stars" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <circle cx="17" cy="43" r="0.125" />
      <circle cx="67" cy="85" r="0.045" />
      <circle cx="81" cy="74" r="0.100" />
      <circle cx="75" cy="73" r="0.100" />
      <circle cx="98" cy="78" r="0.100" />
      <circle cx="32" cy="3" r="0.125" />
      <circle cx="12" cy="17" r="0.080" />
      <circle cx="14" cy="60" r="0.045" />
      <circle cx="89" cy="65" r="0.080" />
      <circle cx="97" cy="68" r="0.045" />
      <circle cx="94" cy="46" r="0.045" />
      <circle cx="39" cy="39" r="0.100" />
      <circle cx="20" cy="85" r="0.125" />
      <circle cx="41" cy="6" r="0.080" />
      <circle cx="56" cy="14" r="0.100" />
      <circle cx="76" cy="73" r="0.100" />
      <circle cx="16" cy="57" r="0.125" />
      <circle cx="98" cy="79" r="0.100" />
      <circle cx="5" cy="76" r="0.065" />
      <circle cx="18" cy="9" r="0.125" />
      <circle cx="87" cy="16" r="0.125" />
    </svg>
    <!-- 星は通常の夜空に紛れ、触れたときだけカラス座の線が現れます。 -->
    <button class="corvus" id="corvus" type="button" aria-label="カラス座を表示する" aria-pressed="false">
      <svg viewBox="0 0 546 601" role="img" aria-label="カラス座の五つの星">
        <path class="constellation-path" d="M 153 41 L 365 102 L 448 423 L 96 474 L 153 41 M 448 423 L 470 553" />
        <g><circle class="star-halo" cx="153" cy="41" r="15"/><circle class="star-core" cx="153" cy="41" r="6"/></g>
        <g><circle class="star-halo" cx="365" cy="102" r="15"/><circle class="star-core" cx="365" cy="102" r="6"/></g>
        <g><circle class="star-halo" cx="448" cy="423" r="15"/><circle class="star-core" cx="448" cy="423" r="6"/></g>
        <g><circle class="star-halo" cx="96" cy="474" r="15"/><circle class="star-core" cx="96" cy="474" r="6"/></g>
        <g><circle class="star-halo" cx="470" cy="553" r="12"/><circle class="star-core" cx="470" cy="553" r="4.6"/></g>
      </svg>
    </button>


    <div class="hero-heading">
      <h1 class="site-title">乙女座の脚元</h1>
      <p class="site-description" id="site-description" aria-label="とりこしくろうのひとつの在り処"></p>
    </div>

    <a class="open-button" href="menu.html" id="site-open">
      ひらく
    </a>

  </main>

  <div class="signal-overlay" id="signal-overlay" hidden aria-hidden="true">
    <div class="signal-stars"><span>✦</span><span class="signal-dot">·</span><span class="signal-right">✦</span></div>
  </div>
  <section class="reply-notice" id="reply-notice" hidden aria-live="polite">
    <h2>交信を受信しました。</h2>
    <p>あなたの言葉に、お返事が届いています。</p>
    <label for="reply-url">秘密のリンク</label>
    <input id="reply-url" type="text" readonly aria-label="返信確認用の秘密のリンク">
    <div class="reply-actions">
      <a id="view-reply" href="#">返信を確認する</a>
      <button id="copy-reply" type="button">リンクをコピー</button>
      <button id="later" type="button">あとで読む</button>
    </div>
    <p class="privacy">秘密のリンクは他人に見せないでください。このお知らせは、送信時にこの端末での通知を希望した場合にだけ表示されます。</p>
  </section>

  <script>
    // タイトル出現後、サブタイトルを一文字ずつ表示する。
    const description = document.getElementById('site-description');
    const subtitle = 'とりこしくろうのひとつの在り処';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion) {
      description.textContent = subtitle;
    } else {
      description.classList.add('typing');
      let index = 0;
      setTimeout(() => {
        const timer = setInterval(() => {
          description.textContent += Array.from(subtitle)[index++];
          if (index >= Array.from(subtitle).length) {
            clearInterval(timer);
            setTimeout(() => description.classList.remove('typing'), 600);
          }
        }, 115);
      }, 1700);
    }

    // PCではホバー、スマホでは指が触れている間だけ星座を表示する。
    const corvus = document.getElementById('corvus');
    const setActive = active => {
      corvus.dataset.active = String(active);
      corvus.setAttribute('aria-pressed', String(active));
    };
    corvus.addEventListener('pointerdown', event => {
      if (event.pointerType === 'touch' || event.pointerType === 'pen') setActive(true);
    });
    for (const type of ['pointerup', 'pointercancel', 'pointerleave']) {
      corvus.addEventListener(type, event => {
        if (event.pointerType === 'touch' || event.pointerType === 'pen') setActive(false);
      });
    }
    // タッチ後に残るフォーカスで線が表示され続けないようにする。
    corvus.addEventListener('click', event => {
      if (event.detail !== 0) corvus.blur();
    });
    corvus.addEventListener('blur', () => setActive(false));
  </script>

  <script type="module">
    import { db } from './archive-common.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
    const receiptKey = 'otomeza-koushin-receipts-v1';
    const seenKey = 'otomeza-koushin-seen-v1';
    const open = document.getElementById('site-open');
    const overlay = document.getElementById('signal-overlay');
    const notice = document.getElementById('reply-notice');
    const validId = id => typeof id === 'string' && /^[A-Za-z0-9_-]{43}$/.test(id);
    function getStored(key) {
      try { const a = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(a) ? a.filter(validId).slice(-20) : []; }
      catch { return []; }
    }
    function saveStored(key, ids) { try { localStorage.setItem(key, JSON.stringify([...new Set(ids)].slice(-20))); } catch {} }
    const menu = () => { location.href = 'menu.html'; };
    let checking = false;
    open.addEventListener('click', async event => {
      const ids = getStored(receiptKey);
      if (!ids.length || checking) { if(checking) event.preventDefault(); return; }
      event.preventDefault(); checking = true;
      open.textContent = '確認中…';
      // 通信不能のときに「ひらく」が長時間止まらないようにする。
      const timeout = new Promise(resolve => setTimeout(() => resolve(null), 4000));
      try {
        const seen = new Set(getStored(seenKey));
        const candidates = ids.filter(id => !seen.has(id)).reverse();
        let found = null;
        for (const id of candidates) {
          const result = await Promise.race([getDoc(doc(db, 'koushin', id)).catch(() => null), timeout]);
          if (result === null) break;
          if (!result.exists()) continue;
          if (typeof result.data().reply === 'string' && result.data().reply.trim()) { found = id; break; }
        }
        if (!found) { menu(); return; }
        const url = new URL('koushin-reply.html', location.href);
        url.hash = 'id=' + found;
        document.getElementById('reply-url').value = url.href;
        document.getElementById('view-reply').href = url.href;
        overlay.hidden = false;
        await new Promise(resolve => setTimeout(resolve, 2000));
        overlay.hidden = true;
        notice.hidden = false;
        // 表示済みの返信は、次回以降の訪問では再通知しない。
        saveStored(seenKey, [...seen, found]);
      } catch (err) { console.error(err); menu(); }
      finally { checking = false; open.textContent = 'ひらく'; }
    });
    document.getElementById('later').addEventListener('click', menu);
    document.getElementById('copy-reply').addEventListener('click', async () => {
      const field = document.getElementById('reply-url');
      try { await navigator.clipboard.writeText(field.value); document.getElementById('copy-reply').textContent = 'コピーしました'; }
      catch { field.focus(); field.select(); document.getElementById('copy-reply').textContent = 'リンクを選択しました'; }
    });
  </script>
</body>
</html>
