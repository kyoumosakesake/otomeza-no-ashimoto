<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女座の脚元｜メニュー</title>

  <style>
    body {
      margin: 0;
      background: #1d3652;
      color: #ffffff;
      font-family: "Yu Mincho", "游明朝", "YuMincho", serif;
    }

    .menu-page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      text-align: center;
      padding: 2rem;
    }

    /* トップページの見出しと同じ位置・文字サイズ */
    .menu-heading {
      position: absolute;
      bottom: calc(50% + 5rem);
      left: 1rem;
      right: 1rem;
    }

    .menu-title {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    /* トップページのサブタイトル分の高さを確保（表示はしない） */
    .menu-heading-spacer {
      margin: 1rem 0 0;
      font-size: 1.15rem;
      line-height: 1.8;
      visibility: hidden;
    }

    .menu-nav {
      position: absolute;
      top: 50%;
      left: 1rem;
      right: 1rem;
      transform: translateY(-43%);
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-link {
      display: inline-block;
      color: #ffffff;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .menu-link:hover {
      opacity: 0.7;
      transform: translateY(-2px);
    }

    .menu-link:focus-visible {
      outline: 2px solid #28bfb0;
      outline-offset: 5px;
    }

    .back-link {
      position: absolute;
      top: calc(50% + 10rem);
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 0.95rem;
      text-decoration: none;
      opacity: 0.75;
      white-space: nowrap;
    }

    .back-link:hover { opacity: 1; }

    @media (max-width: 600px) {
      .menu-title { font-size: 2rem; }
      .menu-heading-spacer { font-size: 1rem; }
      .menu-link { font-size: 1.2rem; }
      .menu-list { gap: 1.55rem; }
      .back-link { top: calc(50% + 8.6rem); }
    }

    /* 高さが小さい端末でも重なりを避ける */
    @media (max-height: 570px) {
      .menu-page { min-height: 570px; }
      .menu-heading { bottom: calc(50% + 5rem); }
    }
  </style>
</head>

<body>

  <main class="menu-page">

    <div class="menu-heading">
      <h1 class="menu-title">乙女座の脚元</h1>
      <p class="menu-heading-spacer" aria-hidden="true">とりこしくろうのひとつの在り処</p>
    </div>

    <nav class="menu-nav">
      <ul class="menu-list">

        <li>
          <a class="menu-link" href="works.html">
            二次創作物
          </a>
        </li>

        <li>
          <a class="menu-link" href="archive.html">
            カラスのアルキバ
          </a>
        </li>

        <li>
          <a class="menu-link" href="koushin.html">
            交信
          </a>
        </li>

        <li>
          <a class="menu-link" href="about.html">
            このサイトについて
          </a>
        </li>

      </ul>
    </nav>

    <a class="back-link" href="index.html">
      もどる
    </a>

  </main>

</body>
</html>
