<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女座の脚元｜メニュー</title>

  <style>
    body {
      margin: 0;
      background: #1d3652;
      color: #ffffff;
      font-family: "Yu Mincho", "游明朝", "YuMincho", serif;
    }

    :root { --accent: #28bfb0; }

    .menu-page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      text-align: center;
      padding: 2rem;
    }

    /* トップページの見出しと同じ位置・文字サイズ */
    .menu-heading {
      position: absolute;
      bottom: calc(50% + 5rem);
      left: 1rem;
      right: 1rem;
    }

    .menu-star {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 1.35rem);
      transform: translateX(-50%);
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 1.65rem;
      line-height: 1;
      text-shadow: 0 0 7px rgba(40,191,176,.7), 0 0 20px rgba(40,191,176,.38);
      user-select: none;
      pointer-events: none;
    }

    .menu-title {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 400;
      letter-spacing: 0.12em;
    }

    /* トップページのサブタイトル分の高さを確保（表示はしない） */
    .menu-heading-spacer {
      margin: 1rem 0 0;
      font-size: 1.15rem;
      line-height: 1.8;
      visibility: hidden;
    }

    .menu-nav {
      position: absolute;
      top: 50%;
      left: 1rem;
      right: 1rem;
      transform: translateY(-43%);
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-list li { position: relative; }

    .menu-link {
      display: inline-block;
      position: relative;
      padding: .15rem .25rem .45rem;
      color: #ffffff;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: color .3s ease, transform .3s ease;
    }

    .menu-link::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 100%;
      height: 1px;
      background: var(--accent);
      opacity: .38;
      transform: translateX(-50%) scaleX(.28);
      transform-origin: center;
      transition: transform .35s ease, opacity .35s ease;
    }

    .menu-link:hover::after,
    .menu-link:focus-visible::after {
      opacity: .9;
      transform: translateX(-50%) scaleX(1);
    }

    .menu-link:hover {
      color: #e0fffb;
      transform: translateY(-2px);
    }

    .menu-link:focus-visible {
      outline: 2px solid #28bfb0;
      outline-offset: 5px;
    }

    .back-link {
      position: absolute;
      top: calc(50% + 13rem);
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 0.95rem;
      text-decoration: none;
      opacity: 0.75;
      white-space: nowrap;
    }

    .back-link:hover { opacity: 1; }

    @keyframes menu-appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .menu-heading { animation: menu-appear .9s ease-out both; }
    .menu-list li { animation: menu-appear .8s ease-out both; }
    .menu-list li:nth-child(1) { animation-delay: .08s; }
    .menu-list li:nth-child(2) { animation-delay: .16s; }
    .menu-list li:nth-child(3) { animation-delay: .24s; }
    .menu-list li:nth-child(4) { animation-delay: .32s; }
    @media (prefers-reduced-motion: reduce) {
      .menu-heading, .menu-list li { animation: none; }
      .menu-link, .menu-link::after { transition: none; }
    }

    @media (max-width: 600px) {
      .menu-title { font-size: 2rem; }
      .menu-heading-spacer { font-size: 1rem; }
      .menu-link { font-size: 1.2rem; }
      .menu-list { gap: 1.55rem; }
      .back-link { top: calc(50% + 11.6rem); }
    }

    /* 高さが小さい端末でも重なりを避ける */
    @media (max-height: 570px) {
      .menu-page { min-height: 570px; }
      .menu-heading { bottom: calc(50% + 5rem); }
    }
  </style>
</head>

<body>

  <main class="menu-page">

    <div class="menu-heading">
      <span class="menu-star" aria-hidden="true">✦</span>
      <h1 class="menu-title">乙女座の脚元</h1>
      <p class="menu-heading-spacer" aria-hidden="true">とりこしくろうのひとつの在り処</p>
    </div>

    <nav class="menu-nav">
      <ul class="menu-list">

        <li>
          <a class="menu-link" href="works.html">
            二次創作物
          </a>
        </li>

        <li>
          <a class="menu-link" href="archive.html">
            カラスのアルキバ
          </a>
        </li>

        <li>
          <a class="menu-link" href="koushin.html">
            交信
          </a>
        </li>

        <li>
          <a class="menu-link" href="about.html">
            このサイトについて
          </a>
        </li>

      </ul>
    </nav>

    <a class="back-link" href="index.html">
      もどる
    </a>

  </main>

</body>
</html>
