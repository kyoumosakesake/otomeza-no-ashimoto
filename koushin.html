<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>交信｜乙女座の脚元</title><link rel="stylesheet" href="koushin.css"><style>
/* 送信成功時の発信演出：既存の共通CSSは変更しません */
.signal-flight{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.signal-particle{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:#bafcf0;box-shadow:0 0 9px 3px rgba(85,233,217,.75),0 0 24px 9px rgba(75,204,212,.24);will-change:transform,opacity}
.signal-particle:after{content:"";position:absolute;left:-27px;top:2px;width:28px;height:2px;background:linear-gradient(90deg,transparent,rgba(145,245,230,.8));filter:blur(1px)}
.signal-pulse{position:absolute;left:0;top:0;width:14px;height:14px;border:1px solid rgba(148,246,231,.9);border-radius:50%;box-shadow:0 0 22px rgba(79,218,207,.45);will-change:transform,opacity}
.signal-flash{animation:signal-arrival .65s ease-out 1}
@keyframes signal-arrival{0%{filter:brightness(1)}35%{filter:brightness(2.2);text-shadow:0 0 30px rgba(151,255,235,.95)}100%{filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.signal-flash{animation:none}}
</style></head><body><main class="shell"><nav class="nav"><a href="index.html">← 乙女座の脚元</a><span>交信</span></nav><header class="hero"><div class="symbol">✦ · ✦</div><h1>交信</h1><p>ここから、私に言葉を届けることができます。<br>名前は必要ありません。感想でも、質問でも、ひとことでも。<br>お返事は気まぐれです。</p></header><section class="panel"><hr class="line"><form id="form"><label for="body" class="label">ことばを送る</label><textarea id="body" class="text" maxlength="4000" placeholder="ここにメッセージをどうぞ。" required></textarea><p class="hint"><span id="count">0</span> / 4000文字</p><div class="actions"><button id="send" class="btn primary" type="submit">送信する ↗</button></div><p class="note">届いた言葉は、管理者だけが読みます。返信はお約束できません。送信後に発行される秘密のリンクから、返信の確認と送信の取り消しができます。リンクをなくすと確認できなくなります。</p><p id="status" class="status" role="status" aria-live="polite"></p></form><section id="done" class="receipt" hidden><h2>ことばを受け取りました。</h2><p>このリンクを保存してください。返信が届いた場合、このリンクから確認できます。</p><input id="receipt-url" type="text" readonly aria-label="秘密のリンク"><div class="actions"><button class="btn primary" id="copy" type="button">リンクをコピー</button><a class="btn" id="open" href="#">確認ページを開く</a></div><p class="note">このリンクを他の人に見せないでください。リンクを知る人はメッセージを閲覧・削除できます。</p></section></section></main><script type="module">
import {db} from './archive-common.js';
import {doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=s=>document.querySelector(s);const body=$('#body');body.addEventListener('input',()=>$('#count').textContent=[...body.value].length);
async function animateSignal(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const origin=$('#send').getBoundingClientRect();
  const symbol=$('.hero .symbol').getBoundingClientRect();
  const sx=origin.left+origin.width/2, sy=origin.top+origin.height/2;
  const tx=symbol.left+symbol.width/2, ty=symbol.top+symbol.height/2;
  const layer=document.createElement('div');layer.className='signal-flight';
  layer.setAttribute('aria-hidden','true');document.body.append(layer);
  const jobs=[];
  // ボタンから波紋が広がり、光の粒が星印に向かって飛んでいく。
  for(let i=0;i<2;i++){
    const ring=document.createElement('span');ring.className='signal-pulse';layer.append(ring);
    const a=ring.animate([
      {transform:`translate(${sx-7}px,${sy-7}px) scale(.2)`,opacity:.9},
      {transform:`translate(${sx-7}px,${sy-7}px) scale(${5+i*2})`,opacity:0}
    ],{duration:650+i*180,delay:i*130,easing:'ease-out',fill:'forwards'});
    jobs.push(a.finished.catch(()=>{}));
  }
  for(let i=0;i<9;i++){
    const dot=document.createElement('span');dot.className='signal-particle';layer.append(dot);
    const offset=(i-4)*7;
    const dx=tx-sx+offset,dy=ty-sy;
    const sway=(i%2===0?1:-1)*(24+i*3);
    const a=dot.animate([
      {transform:`translate(${sx}px,${sy}px) scale(.4)`,opacity:0,offset:0},
      {transform:`translate(${sx+sway*.3}px,${sy+dy*.22}px) scale(1)`,opacity:1,offset:.22},
      {transform:`translate(${sx+dx*.66+sway}px,${sy+dy*.66}px) scale(.85)`,opacity:.9,offset:.7},
      {transform:`translate(${sx+dx}px,${sy+dy}px) scale(.1)`,opacity:0,offset:1}
    ],{duration:1050+i*45,delay:i*65,easing:'ease-in-out',fill:'forwards'});
    jobs.push(a.finished.catch(()=>{}));
  }
  await Promise.all(jobs);
  layer.remove();
  const mark=$('.hero .symbol');mark.classList.remove('signal-flash');
  void mark.offsetWidth;mark.classList.add('signal-flash');
  setTimeout(()=>mark.classList.remove('signal-flash'),700);
}
function makeId(){const bytes=crypto.getRandomValues(new Uint8Array(32));return btoa(String.fromCharCode(...bytes)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');}
$('#form').addEventListener('submit',async e=>{e.preventDefault();const text=body.value.trim();if(!text){$('#status').textContent='メッセージを入力してください。';return;}if(text.length>4000){$('#status').textContent='4000文字以内で入力してください。';return;}if(!confirm('このメッセージを送信しますか？'))return;$('#send').disabled=true;$('#status').textContent='送信中です……';try{const id=makeId();await setDoc(doc(db,'koushin',id),{body:text,createdAt:serverTimestamp(),read:false,archived:false,reply:null});const url=new URL('koushin-reply.html',location.href);url.hash='id='+id;$('#receipt-url').value=url.href;$('#open').href=url.href;$('#status').textContent='言葉を届けています……';await animateSignal();$('#form').hidden=true;$('#done').hidden=false;history.replaceState(null,'',location.pathname); }catch(err){console.error(err);$('#status').textContent='送信できませんでした。通信状態やFirestoreの設定をご確認ください。';}finally{$('#send').disabled=false;}});
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#receipt-url').value);$('#copy').textContent='コピーしました';}catch{$('#receipt-url').select();$('#copy').textContent='リンクを選択しました';}};
</script></body></html>
