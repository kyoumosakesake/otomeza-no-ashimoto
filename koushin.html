<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>交信｜乙女座の脚元</title><link rel="stylesheet" href="koushin.css"></head><body><main class="shell"><nav class="nav"><a href="index.html">← 乙女座の脚元</a><span>交信</span></nav><header class="hero"><div class="symbol">✦ · ✦</div><h1>交信</h1><p>ここから、私に言葉を届けることができます。<br>名前は必要ありません。感想でも、質問でも、ひとことでも。<br>お返事は気まぐれです。</p></header><section class="panel"><hr class="line"><form id="form"><label for="body" class="label">ことばを送る</label><textarea id="body" class="text" maxlength="4000" placeholder="ここにメッセージをどうぞ。" required></textarea><p class="hint"><span id="count">0</span> / 4000文字</p><div class="actions"><button id="send" class="btn primary" type="submit">送信する ↗</button></div><p class="note">届いた言葉は、管理者だけが読みます。返信はお約束できません。送信後に発行される秘密のリンクから、返信の確認と送信の取り消しができます。リンクをなくすと確認できなくなります。</p><p id="status" class="status" role="status" aria-live="polite"></p></form><section id="done" class="receipt" hidden><h2>ことばを受け取りました。</h2><p>このリンクを保存してください。返信が届いた場合、このリンクから確認できます。</p><input id="receipt-url" type="text" readonly aria-label="秘密のリンク"><div class="actions"><button class="btn primary" id="copy" type="button">リンクをコピー</button><a class="btn" id="open" href="#">確認ページを開く</a></div><p class="note">このリンクを他の人に見せないでください。リンクを知る人はメッセージを閲覧・削除できます。</p></section></section></main><script type="module">
import {db} from './archive-common.js';
import {doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=s=>document.querySelector(s);const body=$('#body');body.addEventListener('input',()=>$('#count').textContent=[...body.value].length);
function makeId(){const bytes=crypto.getRandomValues(new Uint8Array(32));return btoa(String.fromCharCode(...bytes)).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');}
$('#form').addEventListener('submit',async e=>{e.preventDefault();const text=body.value.trim();if(!text){$('#status').textContent='メッセージを入力してください。';return;}if(text.length>4000){$('#status').textContent='4000文字以内で入力してください。';return;}if(!confirm('このメッセージを送信しますか？'))return;$('#send').disabled=true;$('#status').textContent='送信中です……';try{const id=makeId();await setDoc(doc(db,'koushin',id),{body:text,createdAt:serverTimestamp(),read:false,archived:false,reply:null});const url=new URL('koushin-reply.html',location.href);url.hash='id='+id;$('#receipt-url').value=url.href;$('#open').href=url.href;$('#form').hidden=true;$('#done').hidden=false;history.replaceState(null,'',location.pathname); }catch(err){console.error(err);$('#status').textContent='送信できませんでした。通信状態やFirestoreの設定をご確認ください。';}finally{$('#send').disabled=false;}});
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#receipt-url').value);$('#copy').textContent='コピーしました';}catch{$('#receipt-url').select();$('#copy').textContent='リンクを選択しました';}};
</script></body></html>
