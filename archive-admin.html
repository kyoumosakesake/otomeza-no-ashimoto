<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿管理｜カラスのアルキバ</title><link rel="stylesheet" href="archive.css"><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script></head>
<body><main class="shell"><nav class="top"><a href="archive.html">← 公開ページ</a><span>カラスのアルキバ｜投稿管理</span></nav><h1 class="brand">投稿管理</h1><p id="message" class="status">ログイン状態を確認しています……</p>
<section id="login" hidden><form class="admin-form" id="login-form"><label class="field">メールアドレス<input id="email" type="email" required autocomplete="username"></label><label class="field">パスワード<input id="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">ログイン</button></form></section>
<section id="dashboard" hidden><div class="admin-actions"><button class="btn primary" id="new">新しい記事</button><button class="btn" id="logout">ログアウト</button></div><div id="post-list" class="admin-list"></div></section>
<section id="compose" hidden><div class="admin-actions"><button class="btn" id="back">← 投稿一覧</button><span id="edit-state" class="status"></span></div><div class="admin-form"><label class="field">タイトル（任意）<input id="post-title" maxlength="180" placeholder="無題でも投稿できます"></label><label class="field">記録日<input id="record-date" type="date"></label>
<div><div class="toolbar"><button class="btn" data-command="bold">太字</button><button class="btn" data-command="italic">斜体</button><button class="btn" id="dots">傍点</button><button class="btn" id="ruby">ルビ</button><button class="btn" id="link">リンク</button><button class="btn" id="image">画像URLを挿入</button></div><div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="ここに書きます"></div></div>
<div class="admin-actions"><button class="btn" id="save">下書き保存／変更を保存</button><button class="btn primary" id="publish">公開する</button><button class="btn" id="unpublish">非公開に戻す</button><button class="btn" id="preview">プレビュー</button><button class="btn" id="delete">削除</button></div><p class="status">公開済み記事で「変更を保存」を押すと、公開状態のまま本文が更新されます。プレビューは編集内容を別タブで表示します。</p></div></section>
</main><script type="module">
import {db,auth,isOwner,esc,safeHTML,hydrateImages} from './archive-common.js';
import {signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {collection,doc,setDoc,updateDoc,deleteDoc,getDoc,getDocs,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const $=s=>document.querySelector(s);let current=null,currentStatus='draft',savedSelection=null,busy=false;
function message(t){$('#message').textContent=t;}
function show(section){for(const id of ['login','dashboard','compose'])$('#'+id).hidden=id!==section;}
function today(){return new Date().toLocaleDateString('en-CA');}
function rememberSelection(){const s=window.getSelection();if(s&&s.rangeCount&&$('#editor').contains(s.anchorNode))savedSelection=s.getRangeAt(0).cloneRange();}
function restoreSelection(){if(!savedSelection)return;$('#editor').focus();const s=window.getSelection();s.removeAllRanges();s.addRange(savedSelection);}
$('#editor').addEventListener('mouseup',rememberSelection);$('#editor').addEventListener('keyup',rememberSelection);
$('#login-form').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#email').value,$('#password').value);$('#password').value='';}catch(e){message('ログインできませんでした。メールアドレスとパスワードを確認してください。');console.error(e);}};
$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){show('login');message('管理者としてログインしてください。');return;}if(!isOwner(user)){show('login');message('このアカウントには投稿権限がありません。');await signOut(auth);return;}show('dashboard');message('ログインしました。');await listPosts();});
async function listPosts(){const box=$('#post-list');box.textContent='読み込み中……';try{const snap=await getDocs(query(collection(db,'posts'),orderBy('createdAt','desc')));box.innerHTML='';if(snap.empty){box.textContent='記事はまだありません。';return;}for(const d of snap.docs){const p=d.data(),row=document.createElement('div');row.className='admin-item';row.innerHTML=`<div><div>${esc(p.title?.trim()||'無題')}</div><small>${p.status==='published'?'公開':'下書き'} · ${esc(p.recordDate||'')}</small></div>`;const b=document.createElement('button');b.className='btn';b.textContent='編集';b.onclick=()=>openPost(d.id);row.append(b);box.append(row);}}catch(e){console.error(e);box.textContent='記事一覧を読み込めませんでした。';}}
$('#new').onclick=()=>{current=null;currentStatus='draft';$('#post-title').value='';$('#record-date').value=today();$('#editor').innerHTML='';$('#edit-state').textContent='新規記事';$('#unpublish').hidden=true;show('compose');};
$('#back').onclick=async()=>{show('dashboard');await listPosts();};
async function openPost(id){try{const snap=await getDoc(doc(db,'posts',id));if(!snap.exists())throw Error('not found');const p=snap.data();current=id;currentStatus=p.status;$('#post-title').value=p.title||'';$('#record-date').value=p.recordDate||today();$('#editor').innerHTML=safeHTML(p.body);await hydrateImages($('#editor'));$('#edit-state').textContent=p.status==='published'?'公開中':'下書き';$('#unpublish').hidden=p.status!=='published';show('compose');}catch(e){message('記事を開けませんでした。');console.error(e);}}
function cleanBody(){const node=$('#editor').cloneNode(true);for(const img of node.querySelectorAll('img')){if(!img.getAttribute('src'))img.remove();}return safeHTML(node.innerHTML);}
async function persist(publish=false){if(busy)return;busy=true;$('#save').disabled=$('#publish').disabled=true;try{const id=current||doc(collection(db,'posts')).id,reference=doc(db,'posts',id),body=cleanBody(),thumbnail=(new DOMParser().parseFromString(body,'text/html').querySelector('img[src]')?.getAttribute('src'))||null;const wasPublished=currentStatus==='published';const data={title:$('#post-title').value,recordDate:$('#record-date').value||today(),body,thumbnail,status:publish?'published':currentStatus,updatedAt:serverTimestamp()};
if(!current){data.createdAt=serverTimestamp();data.publishedAt=publish?serverTimestamp():null;await setDoc(reference,data);}else{if(publish&&!wasPublished){const previous=await getDoc(reference);if(!previous.data()?.publishedAt)data.publishedAt=serverTimestamp();}await updateDoc(reference,data);}current=id;currentStatus=data.status;$('#edit-state').textContent=currentStatus==='published'?'公開中':'下書き';$('#unpublish').hidden=currentStatus!=='published';message(publish?'公開しました。':'保存しました。');}catch(e){message('保存できませんでした。');console.error(e);}finally{busy=false;$('#save').disabled=$('#publish').disabled=false;}}
$('#save').onclick=()=>persist(false);$('#publish').onclick=()=>persist(true);
$('#unpublish').onclick=async()=>{if(!current||!confirm('この記事を非公開に戻しますか？'))return;try{await updateDoc(doc(db,'posts',current),{status:'draft',updatedAt:serverTimestamp()});currentStatus='draft';$('#edit-state').textContent='下書き';$('#unpublish').hidden=true;message('非公開に戻しました。');}catch(e){message('変更できませんでした。');console.error(e);}};
$('#delete').onclick=async()=>{if(!current||!confirm('記事を完全に削除しますか？（GitHub上の画像は削除されません）'))return;try{await deleteDoc(doc(db,'posts',current));current=null;show('dashboard');await listPosts();message('記事を削除しました。');}catch(e){message('削除できませんでした。');console.error(e);}};
for(const b of document.querySelectorAll('[data-command]'))b.onclick=()=>{restoreSelection();document.execCommand(b.dataset.command,false,null);rememberSelection();};
function wrapSelection(tag){restoreSelection();const s=window.getSelection();if(!s.rangeCount||s.isCollapsed){message('先に文字を選択してください。');return;}const range=s.getRangeAt(0),node=document.createElement(tag);try{range.surroundContents(node);}catch{node.append(range.extractContents());range.insertNode(node);}rememberSelection();}
$('#dots').onclick=()=>wrapSelection('em');
$('#ruby').onclick=()=>{restoreSelection();const s=window.getSelection();if(!s.rangeCount||s.isCollapsed){message('ルビを付けたい文字を選択してください。');return;}const reading=prompt('ふりがなを入力してください');if(!reading)return;const r=s.getRangeAt(0),text=r.toString(),ruby=document.createElement('ruby'),rt=document.createElement('rt');ruby.append(document.createTextNode(text));rt.textContent=reading;ruby.append(rt);r.deleteContents();r.insertNode(ruby);};
$('#link').onclick=()=>{restoreSelection();const url=prompt('リンク先URL（https://...）');if(!url)return;try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();document.execCommand('createLink',false,u.href);}catch{message('http または https のURLを入力してください。');}};
$('#image').onclick=()=>{
  const input=prompt('GitHubにアップロードした画像のURLを入力してください（https://...）');
  if(!input)return;
  let url;
  try { url=new URL(input); if(url.protocol!=='https:')throw Error(); }
  catch {message('https:// で始まる画像URLを入力してください。');return;}
  const img=document.createElement('img');img.src=url.href;img.alt='';
  $('#editor').focus();
  if(savedSelection){try{const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedSelection);sel.getRangeAt(0).insertNode(img);}catch{$('#editor').append(img);}}
  else $('#editor').append(img);
  message('画像を挿入しました。記事を保存してください。');
};
$('#preview').onclick=()=>{const w=window.open('','_blank');if(!w){message('ポップアップがブロックされました。');return;}const body=cleanBody();const style='<style>body{background:#1d3652;color:white;font:19px/2.1 serif;padding:35px}article{writing-mode:vertical-rl;height:75vh;overflow:auto}img{max-height:80%;max-width:260px}</style>';w.document.write('<!doctype html><html lang="ja"><meta charset="utf-8"><title>プレビュー</title>'+style+'<h1>'+esc($('#post-title').value||'無題')+'</h1><article>'+body+'</article>');w.document.close();message('プレビューを開きました。画像もプレビューに表示されます。');};
</script></body></html>
