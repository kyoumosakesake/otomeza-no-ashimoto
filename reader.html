<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>作品を読む｜乙女座の脚元</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --background: #1d3652;
    --foreground: #ffffff;
    --accent: #28bfb0;
    --font-size: 19px;
    --reading-font: "Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN", serif;
  }
  html { min-height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--reading-font);
  }
  body.light-mode { --background: #ffffff; --foreground: #171717; }
  button, input { font-family: inherit; }
  .site-header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  .site-name {
    color: var(--foreground);
    font-size: .9rem;
    letter-spacing: .12em;
    text-decoration: none;
  }
  .settings-button {
    padding: .55rem .9rem;
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--foreground);
    border-radius: 4px;
    font-size: .85rem;
    cursor: pointer;
  }
  .settings-button:hover { color: var(--accent); border-color: var(--accent); }
  .settings-button { display: inline-flex; align-items: center; justify-content: center; gap: .4em; white-space: nowrap; flex-wrap: nowrap; }
  .settings-gear { display: block; width: 1.4em; height: 1.4em; flex: none; color: var(--accent); }
  .settings-button > span { color: #ffffff; }
  body.light-mode .settings-button > span { color: #171717; }
  .settings-panel {
    display: none;
    position: absolute;
    top: 75px;
    right: 20px;
    width: min(320px, calc(100vw - 40px));
    max-height: calc(100vh - 95px);
    overflow-y: auto;
    padding: 1.4rem;
    background: var(--background);
    color: var(--foreground);
    border: 1px solid var(--foreground);
    border-radius: 7px;
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
    z-index: 1000;
  }
  .settings-panel.open { display: block; }
  .settings-title { margin: 0 0 1.3rem; font-size: 1rem; font-weight: 400; }
  .setting-group { margin-bottom: 1.4rem; }
  .setting-label { display: block; margin-bottom: .65rem; font-size: .8rem; opacity: .75; }
  .setting-buttons { display: flex; gap: .5rem; }
  .setting-option {
    flex: 1;
    padding: .6rem .3rem;
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--foreground);
    border-radius: 4px;
    font-size: .85rem;
    cursor: pointer;
    opacity: .6;
  }
  .setting-option.active {
    background: var(--accent);
    color: #1d3652;
    border-color: var(--accent);
    opacity: 1;
  }
  .slider-wrap { position: relative; padding: .35rem 0 .5rem; }
  .font-slider {
    display: block;
    position: relative;
    z-index: 2;
    width: 100%;
    margin: .5rem 0;
    accent-color: var(--accent);
    background: transparent;
  }
  .slider-dots {
    position: absolute;
    z-index: 1;
    left: 8px;
    right: 8px;
    top: calc(.35rem + .5rem + 8px);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .slider-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--foreground);
    opacity: .8;
    transform: translate(-50%, -50%);
  }
  .slider-dots span:first-child { transform: translate(0, -50%); }
  .slider-dots span:last-child { transform: translate(-100%, -50%); }
  .font-slider-labels { display: flex; justify-content: space-between; font: .7rem sans-serif; opacity: .65; }
  .settings-close {
    width: 100%; padding: .7rem;
    background: var(--foreground);
    color: var(--background);
    border: 1px solid var(--foreground);
    border-radius: 4px; cursor: pointer;
  }
  .reading-layout { width: 100%; min-height: 70vh; }
  .work-header { color: var(--foreground); }
  .work-title { margin: 0; font-weight: 400; letter-spacing: .12em; line-height: 1.8; }
  .work-date { margin: 0; font-size: .8rem; opacity: .6; }
  .reader { min-width: 0; font-family: var(--reading-font); }
  .novel-text {
    font-size: var(--font-size);
    line-height: 2.2;
    letter-spacing: 1px;
    line-break: strict;
    word-break: normal;
    hanging-punctuation: allow-end;
    overflow-wrap: normal;
  }
  /* スマホ縦書きのみ、本文と同じ組版フローにタイトルを入れる */
  .mobile-vertical-title { display: none; }
  .novel-text p { margin: 0; padding: 0; text-indent: 0; white-space: pre-wrap; }
  /* シリーズ作品の章タイトル：読書設定の本文サイズより常に2px大きく表示 */
  .novel-text p.novel-chapter-title {
    font-size: calc(var(--font-size) + 2px);
    font-weight: 700;
    margin-block-start: 1.3em;
    margin-block-end: .6em;
    text-indent: 0;
    break-inside: avoid;
  }
  .kinsoku-pair { white-space: nowrap; }
  /* ダッシュ同士は密着させ、前後の本文とは各1px離す */
  .dash-run { letter-spacing: 0; white-space: nowrap; margin-inline: 1px; }
  .tcy { text-combine-upright: all; -webkit-text-combine: horizontal; }
  ruby { ruby-position: over; }
  rt { font-size: .5em; font-weight: normal; letter-spacing: 0; }

  /* 横書き */
  .reading-layout.horizontal {
    display: block;
    height: auto;
    min-height: 70vh;
    max-width: none;
    overflow: visible;
    direction: ltr;
    touch-action: auto;
  }
  .reading-layout.horizontal .work-header {
    max-width: 800px; margin: 3rem auto 0;
    padding: 0 1.5rem; text-align: center;
  }
  .reading-layout.horizontal .work-title { font-size: 1.7rem; }
  .reading-layout.horizontal .work-date { margin-top: .8rem; }
  .reading-layout.horizontal .reader {
    max-width: 800px; margin: 0 auto; padding: calc(5 * var(--font-size) * 2.2) 1.5rem 0;
  }
  .reading-layout.horizontal .novel-text {
    writing-mode: horizontal-tb;
    height: auto;
    width: auto;
    max-width: 100%;
    overflow-wrap: break-word;
  }
  .reading-layout.horizontal .novel-blank-line { height: 1em; }

  /* 縦書き：右端にタイトル、その左に本文 */
  .reading-layout.vertical {
    display: flex;
    flex-direction: row;
    direction: rtl;
    align-items: flex-start;
    gap: 2.5rem;
    width: 100%;
    max-width: 100vw;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100dvh;
    min-height: 0;
    padding: 1.25rem 1.5rem .35rem;
    scroll-behavior: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: auto; /* 横スワイプはブラウザのネイティブスクロールに任せる */
  }
  .reading-layout.vertical .work-header {
    display: none;
    flex: 0 0 auto;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 1.2rem;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    direction: ltr;
    height: 65vh;
    padding: 1rem 0;
  }
  .reading-layout.vertical .work-title { font-size: 1.2rem; line-height: 1.7; }
  .reading-layout.vertical .work-date { font-size: .75rem; margin: 0; }
  .reading-layout.vertical .reader {
    flex: 0 0 auto;
    width: max-content;
    min-width: 0;
    overflow: visible;
    padding: .5rem 0 .35rem;
    direction: ltr;
  }
  .reading-layout.vertical .novel-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    direction: ltr;
    height: calc(100dvh - 3rem - var(--font-size));
    width: max-content;
    min-width: 0;
    margin: 0;
  }
  .reading-layout.vertical .work-header { display: none; }
  /* PC・スマホ共通：タイトルと設定を本文の最初の列に置く。 */
  .reading-layout.vertical .mobile-vertical-title {
    display: block;
    margin-block-end: calc(5 * var(--font-size));
    font-size: 16px;
    line-height: 1.8;
    letter-spacing: .12em;
  }
  .reading-layout.vertical .mobile-vertical-title h2 {
    margin: 0;
    font-size: 1em;
    line-height: 1.8;
    font-weight: 400;
  }
  .reading-layout.vertical .mobile-vertical-title .mobile-date {
    margin: 0;
    font-size: .7em;
    opacity: .6;
    letter-spacing: 0;
  }
  .reading-layout.vertical .mobile-settings-button {
    display: inline-flex;
    writing-mode: horizontal-tb;
    white-space: nowrap;
    font-family: sans-serif;
    font-size: 12px;
    padding: .5rem .65rem;
    width: max-content;
    margin: 0 0 0 2rem;
  }
  /* 縦書きでは設定を横スクロールの先頭にだけ表示する */
  body.vertical-reading .site-header { display: none; }
  /* ↩ の矢印の先端が左を向く角度にする */
  .reading-layout.vertical .vertical-end-link a {
    display: inline-block;
    writing-mode: horizontal-tb;
    transform: rotate(0deg);
    transform-origin: center;
  }
  .reading-layout.vertical .novel-blank-line { display: block; width: 1em; height: auto; }
  /* 縦書きでは本文の最後の列に「作品一覧へ戻る」を置く。 */
  .vertical-end-link { display: none; }
  .reading-layout.vertical .vertical-end-link {
    display: block;
    margin-block-start: 11.9em; /* 本文末尾からの余白を従来の1.7倍に */
    margin-block-end: 1.5em;
    font-size: .9em;
    line-height: 2;
    white-space: nowrap;
  }
  .reading-layout.vertical .vertical-end-link a {
    color: var(--foreground);
    text-decoration: none;
    opacity: .75;
  }
  .reading-layout.vertical .vertical-end-link a:hover { color: var(--accent); opacity: 1; }
  .reading-layout.vertical .vertical-end-link a {
    font-size: 1.7rem;
    line-height: 1.5;
  }
  .reading-layout.vertical + .work-footer { display: none; }
  /* PC縦書き：下部の余分なフッターを除き、縦スクロールを発生させない。 */
  @media (min-width: 601px) {
    html:has(body.vertical-reading), body.vertical-reading {
      height: 100dvh;
      min-height: 0;
      overflow-y: hidden;
    }
    body.vertical-reading:not(.microfiction-reading) .reading-layout.vertical {
      height: 100dvh;
      overflow-y: hidden;
      padding-top: 0;
      padding-bottom: 0;
      align-items: flex-start;
    }
    body.vertical-reading:not(.microfiction-reading) .reading-layout.vertical .reader {
      padding-top: 0;
      padding-bottom: 0;
    }
    body.vertical-reading:not(.microfiction-reading) .reading-layout.vertical .novel-text {
      /* PC縦書き：上端を30px上げ、下端を20px上げる。 */
      margin-top: calc(var(--font-size) * 2.2 * 3 - 30px);
      height: calc(100dvh - var(--font-size) - 1rem - var(--font-size) * 2.2 * 3 + 10px);
    }
    body.vertical-reading:not(.microfiction-reading) .work-footer { display: none; }
  }
  .work-footer { max-width: 800px; margin: calc(7 * var(--font-size) * 2.2) auto 5rem; padding: 0 1.5rem; text-align: center; }
  .back-link { color: var(--foreground); font-size: 1.7rem; text-decoration: none; opacity: .7; }
  .back-link:hover { color: var(--accent); opacity: 1; }
  @media (max-width: 600px) {
    .site-header { padding: 1.2rem 1rem; }
    .site-name { font-size: .8rem; }
    /* LTRのスクロール座標と既存のドラッグ操作を維持する。 */
    .reading-layout.vertical {
      direction: ltr;
      flex-direction: row;
      gap: 0;
      height: auto;
      min-height: 70vh;
      padding: 2.25rem .75rem 2rem;
      overflow-x: scroll;
      overflow-y: hidden;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    /* タイトルを独立したflex要素にすると並びが反転するため、
       スマホ縦書きでは本文の最初の列として表示する。 */
    .reading-layout.vertical .work-header { display: none; }
    .reading-layout.vertical .reader { padding: .5rem 0; }
    /* ページ上端・設定ボタンとタイトルの間に余白を作る */
    .reading-layout.vertical .mobile-vertical-title {
      padding-inline-start: 1rem;
    }
    .reading-layout.vertical .mobile-settings-button {
      margin-left: 2.25rem;
      margin-inline-start: 1rem;
      position: relative;
      left: -1rem; /* 画面の左方向へ1文字分ずらす */
    }
    /* 上下の余白を確保し、本文が画面下にはみ出さない高さにする */
    .reading-layout.vertical .novel-text {
      height: max(360px, calc(100dvh - 110px + var(--font-size)));
    }
    .reading-layout.vertical .work-header {
      height: max(360px, calc(100dvh - 110px));
    }
    /* スマホ縦書きでも、読了後の操作は本文末尾に表示する */
    .reading-layout.vertical .vertical-end-link { display: block; }
    .reading-layout.horizontal .work-title { font-size: 1.4rem; }
  }

  /* PC縦書き専用：左右の端にカーソルを寄せるとページ送りが現れる */
  .desktop-page-turn {
    display: none;
  }
  @media (min-width: 601px) and (hover: hover) and (pointer: fine) {
    body.vertical-reading .desktop-page-turn {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--foreground);
      opacity: 0;
      cursor: pointer;
      font-size: 16px;
      transition: opacity .2s ease, background-color .2s ease;
    }
    body.vertical-reading .desktop-page-turn:hover,
    body.vertical-reading .desktop-page-turn:focus-visible {
      opacity: 1;
      background: rgba(110, 130, 160, .12);
    }
    body.vertical-reading .desktop-page-turn.left { left: 0; }
    body.vertical-reading .desktop-page-turn.right { right: 0; }
  }

  /* 本文末尾：戻る・ブックマーク・共有 */
  .end-actions { display: inline-flex; align-items: center; justify-content: center; gap: 1.15rem; }
  .end-action { display: inline-flex; align-items: center; justify-content: center; padding: .2rem; border: 0; background: transparent; color: var(--foreground); font: 1.7rem/1.5 sans-serif; opacity: .75; text-decoration: none; cursor: pointer; }
  .end-action:hover, .end-action:focus-visible { color: var(--accent); opacity: 1; }
  .end-action.bookmarked { color: var(--accent); opacity: 1; }
  .share-ripple { display: block; flex: none; width: 28px; height: 28px; object-fit: contain; }
  .share-status { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 1200; background: var(--foreground); color: var(--background); padding: .65rem 1rem; border-radius: 5px; font: .8rem/1.6 sans-serif; box-shadow: 0 5px 18px rgba(0,0,0,.25); max-width: calc(100vw - 2rem); text-align: center; }
  .share-status[hidden] { display: none; }
  .reading-layout.vertical .vertical-end-link { white-space: normal; }
  .reading-layout.vertical .vertical-end-link .end-actions { writing-mode: horizontal-tb; flex-direction: column; gap: .9rem; }
  .reading-layout.vertical .vertical-end-link .end-action { writing-mode: horizontal-tb; transform: none; }
  .work-footer .end-actions { display: flex; }
  @media (max-width: 600px) {
    /* 縦書きの読書設定とタイトルの間に十分な余白を追加 */
    .reading-layout.vertical .mobile-settings-button { margin-left: 4rem; }
  }

  /* 140字小説：閲覧設定が縦書きでも、画像と併載本文は常に横書き。 */
  .reading-layout.microfiction,
  .reading-layout.microfiction.horizontal {
    display: block;
    width: 100%; max-width: none; height: auto; min-height: 70vh;
    overflow: visible; padding: 0; direction: ltr;
  }
  .reading-layout.microfiction .work-header {
    display: block; max-width: 1200px; margin: 2rem auto 1.5rem;
    padding: 0 1.5rem; text-align: center;
    writing-mode: horizontal-tb; height: auto;
  }
  .reading-layout.microfiction .work-title { font-size: 1.6rem; }
  .reading-layout.microfiction .work-date { margin-top: .5rem; }
  .reading-layout.microfiction .reader {
    width: 100%; max-width: 1200px; margin: 0 auto;
    padding: 1.5rem 1.5rem 2rem; overflow: visible;
  }
  .reading-layout.microfiction .novel-text {
    writing-mode: horizontal-tb; direction: ltr; width: 100%; height: auto;
    margin: 0; line-height: 1.9; letter-spacing: .035em;
  }
  .microfiction-pair {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr);
    align-items: center; gap: clamp(1.5rem, 4vw, 4rem);
    width: 100%;
  }
  .microfiction-copy {
    writing-mode: horizontal-tb; min-width: 0;
    font-size: var(--font-size); line-height: 1.95;
    overflow-wrap: anywhere;
  }
  .microfiction-copy p { margin: 0; padding: 0; white-space: pre-wrap; }
  .microfiction-image { display: block; width: 100%; height: auto; aspect-ratio: 910 / 590; object-fit: contain; }
  .microfiction-figure { margin: 0; min-width: 0; }
  .reading-layout.microfiction .mobile-vertical-title,
  .reading-layout.microfiction .vertical-end-link { display: none; }
  body.microfiction-reading .setting-group:has([data-setting="direction"]) { display: none; }
  @media (max-width: 600px) {
    .reading-layout.microfiction .work-header { margin: 1rem auto 1.25rem; padding: 0 1rem; }
    .reading-layout.microfiction .work-title { font-size: 1.35rem; }
    .reading-layout.microfiction .reader { padding: .75rem 1rem 2rem; }
    .microfiction-pair { display: flex; flex-direction: column-reverse; align-items: stretch; gap: 1.5rem; }
    .microfiction-copy { line-height: 2; }
  }

  /* 作品タイトルは読書設定の本文サイズより常に2px大きくする。日付サイズは従来のまま。 */
  .reading-layout.horizontal .work-title,
  .reading-layout.vertical .work-title,
  .reading-layout.microfiction .work-title {
    font-size: calc(var(--font-size) + 2px);
  }
  .reading-layout.vertical .mobile-vertical-title {
    font-size: calc(var(--font-size) + 2px);
  }
  /* 従来の16px × .7 = 11.2px を固定し、タイトル変更による日付の拡大を防ぐ。 */
  .reading-layout.vertical .mobile-vertical-title .mobile-date {
    font-size: 11.2px;
  }
  /* スマホ縦書き：画面下部のフッターは隠し、本文末尾に操作を配置する。
     縦書き本文の最後の列に追加済みの .vertical-end-link を表示。 */
  @media (max-width: 600px) {
    body.vertical-reading:not(.microfiction-reading) .work-footer {
      display: none;
    }
    .reading-layout.vertical:not(.microfiction) .vertical-end-link {
      display: block;
    }
  }
</style>
</head>
<body>
<header class="site-header">
  <button class="settings-button" id="settings-button" type="button" aria-expanded="false" aria-controls="settings-panel"><svg class="settings-gear" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M 9.06 3.92 L 9.65 0.95 L 14.35 0.95 L 14.94 3.92 L 15.63 4.21 L 18.15 2.52 L 21.48 5.85 L 19.79 8.37 L 20.08 9.06 L 23.05 9.65 L 23.05 14.35 L 20.08 14.94 L 19.79 15.63 L 21.48 18.15 L 18.15 21.48 L 15.63 19.79 L 14.94 20.08 L 14.35 23.05 L 9.65 23.05 L 9.06 20.08 L 8.37 19.79 L 5.85 21.48 L 2.52 18.15 L 4.21 15.63 L 3.92 14.94 L 0.95 14.35 L 0.95 9.65 L 3.92 9.06 L 4.21 8.37 L 2.52 5.85 L 5.85 2.52 L 8.37 4.21 Z M 15.25 12 A 3.25 3.25 0 1 0 8.75 12 A 3.25 3.25 0 1 0 15.25 12 Z" fill="currentColor" fill-rule="evenodd"/></svg><span>読書設定</span></button>
</header>

<div class="settings-panel" id="settings-panel" role="dialog" aria-label="読書設定">
  <h2 class="settings-title">読書設定</h2>
  <div class="setting-group">
    <span class="setting-label">組み方向</span>
    <div class="setting-buttons">
      <button class="setting-option" data-setting="direction" data-value="vertical" type="button">縦書き</button>
      <button class="setting-option" data-setting="direction" data-value="horizontal" type="button">横書き</button>
    </div>
  </div>
  <div class="setting-group">
    <span class="setting-label">フォント</span>
    <div class="setting-buttons">
      <button class="setting-option" data-setting="font" data-value="mincho" type="button">明朝体</button>
      <button class="setting-option" data-setting="font" data-value="gothic" type="button">ゴシック体</button>
    </div>
  </div>
  <div class="setting-group">
    <label class="setting-label" for="font-size-slider">文字サイズ</label>
    <div class="slider-wrap">
      <div class="slider-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <input class="font-slider" id="font-size-slider" type="range" min="0" max="4" step="1" value="2" aria-label="文字サイズ（15・17・19・21・23ピクセル）">
    </div>
    <div class="font-slider-labels"><span>小</span><span>標準</span><span>大</span></div>
  </div>
  <div class="setting-group">
    <span class="setting-label">画面の色</span>
    <div class="setting-buttons">
      <button class="setting-option" data-setting="theme" data-value="dark" type="button">ダーク</button>
      <button class="setting-option" data-setting="theme" data-value="light" type="button">ライト</button>
    </div>
  </div>
  <button class="settings-close" id="settings-close" type="button">閉じる</button>
</div>

<script src="novels.js?v=20261031-navigation"></script>
<script>
  const fontSizes = [15, 17, 19, 21, 23];
  const storageKey = "otomeza-reader-settings";
  const defaultSettings = { direction: "vertical", font: "mincho", theme: "dark", fontSize: 19 };
  let savedSettings = {};
  try { savedSettings = JSON.parse(localStorage.getItem(storageKey)) || {}; }
  catch (error) { savedSettings = {}; }
  const settings = { ...defaultSettings, ...savedSettings };
  // 旧5段階の選択位置を維持しながら、新しい15～23pxの5段階に移行します。
  if (settings.fontScaleVersion !== 3) {
    const oldSizes = settings.fontScaleVersion === 2 ? [12, 14, 16, 18, 20] : [16, 18, 20, 22, 24];
    const oldIndex = oldSizes.indexOf(Number(settings.fontSize));
    settings.fontSize = oldIndex >= 0 ? fontSizes[oldIndex] : 19;
  }
  settings.fontScaleVersion = 3;
  if (!fontSizes.includes(Number(settings.fontSize))) settings.fontSize = 19;
  settings.fontSize = Number(settings.fontSize);
  if (!["vertical", "horizontal"].includes(settings.direction)) settings.direction = "vertical";
  if (!["mincho", "gothic"].includes(settings.font)) settings.font = "mincho";
  if (!["dark", "light"].includes(settings.theme)) settings.theme = "dark";

  const layout = document.getElementById("reading-layout");
  const settingsButton = document.getElementById("settings-button");
  const settingsPanel = document.getElementById("settings-panel");
  const fontSizeSlider = document.getElementById("font-size-slider");

  function saveSettings() {
    try { localStorage.setItem(storageKey, JSON.stringify(settings)); }
    catch (error) { /* 保存できなくても読書は続けられます */ }
  }
  function applySettings() {
    const displayDirection = isMicrofiction ? "horizontal" : settings.direction;
    layout.classList.toggle("vertical", displayDirection === "vertical");
    layout.classList.toggle("horizontal", displayDirection === "horizontal");
    document.documentElement.style.setProperty("--reading-font",
      settings.font === "gothic"
        ? '"Yu Gothic", "游ゴシック", "YuGothic", "Hiragino Kaku Gothic ProN", sans-serif'
        : '"Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN", serif');
    document.documentElement.style.setProperty("--font-size", `${settings.fontSize}px`);
    fontSizeSlider.value = String(fontSizes.indexOf(settings.fontSize));
    document.body.classList.toggle("light-mode", settings.theme === "light");
    document.body.classList.toggle("vertical-reading", displayDirection === "vertical");
    document.querySelectorAll(".setting-option").forEach(button => {
      const active = (button.dataset.setting === "direction" ? displayDirection : settings[button.dataset.setting]) === button.dataset.value;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }
  function resetReadingPosition() {
    if (isMicrofiction || settings.direction !== "vertical") return;
    // スマホはLTR座標。右端（タイトル）から読み始めます。
    if (mobileScreen.matches) {
      layout.scrollLeft = layout.scrollWidth - layout.clientWidth;
    } else {
      layout.scrollLeft = 0;
    }
  }
  // Safariなどで縦書きの列組みが残ったまま横書きへ切り替わるのを防ぐ。
  // サイズ変更後も実レイアウトを再計算し、両方向のスクロール座標を整える。
  function refreshReadingLayout({ resetVerticalPosition = false } = {}) {
    const horizontal = isMicrofiction || settings.direction === "horizontal";
    if (horizontal) {
      layout.scrollLeft = 0;
      layout.scrollTop = 0;
    }
    // writing-mode と font-size を同時に変えた際のレイアウト更新を確定させる。
    void layout.offsetHeight;
    requestAnimationFrame(() => {
      if (horizontal) {
        layout.scrollLeft = 0;
        layout.scrollTop = 0;
      } else if (resetVerticalPosition) {
        resetReadingPosition();
      }
      requestAnimationFrame(() => {
        if (horizontal) {
          layout.scrollLeft = 0;
          layout.scrollTop = 0;
        } else if (resetVerticalPosition) {
          resetReadingPosition();
        }
      });
    });
  }
  function resetAfterLayout() {
    refreshReadingLayout({ resetVerticalPosition: true });
  }
  document.querySelectorAll(".setting-option").forEach(button => {
    button.addEventListener("click", () => {
      const previousDirection = settings.direction;
      if (isMicrofiction && button.dataset.setting === "direction") return;
      settings[button.dataset.setting] = button.dataset.value;
      applySettings();
      saveSettings();
      if (settings.direction !== previousDirection) {
        refreshReadingLayout({ resetVerticalPosition: settings.direction === "vertical" });
      }
    });
  });
  // フォント変更時、画面中央の文字をアンカーにして読み位置を保つ。
  // スクロール量ではなく文字ノード＋文字位置を記録するため、改行位置が変わっても追従する。
  function readingAnchor() {
    const bounds = layout.getBoundingClientRect();
    const vertical = !isMicrofiction && settings.direction === "vertical";
    const x = vertical ? bounds.left + bounds.width * .5 : window.innerWidth * .5;
    const y = vertical ? bounds.top + bounds.height * .5 : window.innerHeight * .5;
    const samples = vertical
      ? [[x,y],[x - bounds.width * .12,y],[x + bounds.width * .12,y]]
      : [[x,y],[x,y - 60],[x,y + 60]];
    for (const [px, py] of samples) {
      let node, offset;
      if (document.caretPositionFromPoint) {
        const pos = document.caretPositionFromPoint(px, py);
        if (pos) { node = pos.offsetNode; offset = pos.offset; }
      } else if (document.caretRangeFromPoint) {
        const pos = document.caretRangeFromPoint(px, py);
        if (pos) { node = pos.startContainer; offset = pos.startOffset; }
      }
      if (!node || !document.getElementById("novel-text").contains(node)) continue;
      if (node.nodeType !== Node.TEXT_NODE || !node.length) continue;
      const range = document.createRange();
      range.setStart(node, Math.min(offset, node.length - 1));
      range.setEnd(node, Math.min(offset + 1, node.length));
      const rect = range.getBoundingClientRect();
      if (!rect.width && !rect.height) continue;
      return { node, offset, x: rect.left + rect.width / 2, y: rect.top + rect.height / 2, vertical };
    }
    return null;
  }
  function restoreReadingAnchor(anchor) {
    if (!anchor || !anchor.node.isConnected) return;
    const range = document.createRange();
    range.setStart(anchor.node, Math.min(anchor.offset, anchor.node.length - 1));
    range.setEnd(anchor.node, Math.min(anchor.offset + 1, anchor.node.length));
    const rect = range.getBoundingClientRect();
    if (anchor.vertical) {
      // RTLスクロール座標はブラウザで異なるため、移動後の実測で補正する。
      const delta = rect.left + rect.width / 2 - anchor.x;
      layout.scrollLeft += delta;
      const actual = range.getBoundingClientRect();
      const remaining = actual.left + actual.width / 2 - anchor.x;
      if (Math.abs(remaining) > 2) layout.scrollLeft += remaining;
    } else {
      const delta = rect.top + rect.height / 2 - anchor.y;
      window.scrollBy(0, delta);
    }
  }
  fontSizeSlider.addEventListener("input", () => {
    const anchor = settingsPanel.classList.contains("open") ? readingAnchor() : null;
    settings.fontSize = fontSizes[Number(fontSizeSlider.value)];
    applySettings();
    saveSettings();
    // 文字組みの再計算後、同じ文字を元の画面位置に戻す。
    void layout.offsetHeight;
    restoreReadingAnchor(anchor);
    requestAnimationFrame(() => restoreReadingAnchor(anchor));
  });
  function toggleSettingsPanel(open) {
    settingsPanel.classList.toggle("open", open);
    settingsButton.setAttribute("aria-expanded", String(open));
  }
  settingsButton.addEventListener("click", () => toggleSettingsPanel(!settingsPanel.classList.contains("open")));
  document.getElementById("settings-close").addEventListener("click", () => toggleSettingsPanel(false));
  document.addEventListener("click", event => {
    if (!settingsPanel.contains(event.target) && !settingsButton.contains(event.target)) toggleSettingsPanel(false);
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") toggleSettingsPanel(false);
  });

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }
  function formatPlainText(value) {
    // 「!?」など2文字の記号を縦中横にします。
    // 「～」「〜」は直前の文字と組にして行頭への孤立を防ぎます。
    return String(value).split(/(─{2,}|[!?！？]{2}|[^\s～〜][～〜])/g).map(part => {
      if (/^─{2,}$/.test(part)) return `<span class="dash-run">${escapeHTML(part)}</span>`;
      if (/^[!?！？]{2}$/.test(part)) return `<span class="tcy">${escapeHTML(part)}</span>`;
      if (/^[^\s～〜][～〜]$/.test(part)) return `<span class="kinsoku-pair">${escapeHTML(part)}</span>`;
      return escapeHTML(part);
    }).join("");
  }
  function formatNovelText(text, chapterTitles = []) {
    const source = String(text ?? "").replace(/\r\n?/g, "\n").replace(/^\n+|\n+$/g, "");
    if (source.length === 0) return "<p>ここに本文が入ります。</p>";
    const chapterSet = new Set(chapterTitles);
    const rubyPattern = /\[\[rb:\s*([^>\]\n]+?)\s*>\s*([^\]\n]+?)\s*\]\]/g;
    return source.split("\n").map(line => {
      // DOCXで太字だった独立段落のみを章タイトルとして扱う。
      const chapterMatch = /^\[\[chapter:(.*?)\]\]$/.exec(line);
      if (chapterMatch && chapterSet.has(chapterMatch[1])) {
        return `<p class="novel-chapter-title">${escapeHTML(chapterMatch[1])}</p>`;
      }
      if (line === "") return '<div class="novel-blank-line"></div>';
      if (/^(?:……|──)/.test(line)) line = "　" + line;
      let html = "";
      let lastIndex = 0;
      for (const match of line.matchAll(rubyPattern)) {
        html += formatPlainText(line.slice(lastIndex, match.index));
        html += `<ruby>${escapeHTML(match[1].trim())}<rt>${escapeHTML(match[2].trim())}</rt></ruby>`;
        lastIndex = match.index + match[0].length;
      }
      html += formatPlainText(line.slice(lastIndex));
      return `<p>${html}</p>`;
    }).join("\n");
  }

  const workId = new URLSearchParams(window.location.search).get("work");
  const readingReturnKey = "otomeza-fanworks-return-v1";
  function getReturnUrl() {
    let tab = null;
    try {
      const state = JSON.parse(sessionStorage.getItem(readingReturnKey) || "null");
      if (state && state.id === workId && ["timeline", "writing"].includes(state.tab)) {
        tab = state.tab;
      }
    } catch (_) {}
    if (!tab) return "fanworks.html";
    return "fanworks.html?" + new URLSearchParams({
      from: "reader", tab, work: workId
    }).toString();
  }
  document.querySelectorAll('a[aria-label="作品一覧へ戻る"]').forEach(link => {
    link.href = getReturnUrl();
  });
  const novelList = typeof novels !== "undefined" && Array.isArray(novels) ? novels : [];
  const currentWork = novelList.find(work => work.id === workId);
  const isMicrofiction = Boolean(currentWork && currentWork.format === "microfiction");
  layout.classList.toggle("microfiction", isMicrofiction);
  document.body.classList.toggle("microfiction-reading", isMicrofiction);
  if (currentWork) {
    document.getElementById("work-title").textContent = currentWork.title;
    document.getElementById("work-date").textContent = currentWork.date || "";
    if (isMicrofiction) {
      const image = escapeHTML(currentWork.image || "");
      const title = escapeHTML(currentWork.title);
      document.getElementById("novel-text").innerHTML = `<div class="microfiction-pair">
        <div class="microfiction-copy">${formatNovelText(String(currentWork.text || "").trim(), [])}</div>
        <figure class="microfiction-figure"><img class="microfiction-image" src="${image}" alt="『${title}』の縦書き画像" width="910" height="590" loading="eager"></figure>
      </div>`;
    } else {
      document.getElementById("novel-text").innerHTML = formatNovelText(currentWork.text, currentWork.chapterTitles || []);
    }
    document.title = `${currentWork.title}｜乙女座の脚元`;
  } else {
    document.getElementById("work-title").textContent = "作品が見つかりません";
    document.getElementById("work-date").textContent = "";
    document.getElementById("novel-text").innerHTML = "<p>作品データを確認してください。</p>";
  }

  // PC・スマホとも縦書きのタイトルは本文の最初の列に置く。
  // 本文データは変更せず、横書きではこの要素を非表示にする。
  if (currentWork && !isMicrofiction) {
    const mobileHeading = document.createElement("div");
    mobileHeading.className = "mobile-vertical-title";
    const mobileTitle = document.createElement("h2");
    mobileTitle.textContent = currentWork.title;
    const mobileDate = document.createElement("p");
    mobileDate.className = "mobile-date";
    mobileDate.textContent = currentWork.date || "";
    const mobileSettings = document.createElement("button");
    mobileSettings.type = "button";
    mobileSettings.className = "settings-button mobile-settings-button";
    mobileSettings.innerHTML = '<svg class="settings-gear" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M 9.06 3.92 L 9.65 0.95 L 14.35 0.95 L 14.94 3.92 L 15.63 4.21 L 18.15 2.52 L 21.48 5.85 L 19.79 8.37 L 20.08 9.06 L 23.05 9.65 L 23.05 14.35 L 20.08 14.94 L 19.79 15.63 L 21.48 18.15 L 18.15 21.48 L 15.63 19.79 L 14.94 20.08 L 14.35 23.05 L 9.65 23.05 L 9.06 20.08 L 8.37 19.79 L 5.85 21.48 L 2.52 18.15 L 4.21 15.63 L 3.92 14.94 L 0.95 14.35 L 0.95 9.65 L 3.92 9.06 L 4.21 8.37 L 2.52 5.85 L 5.85 2.52 L 8.37 4.21 Z M 15.25 12 A 3.25 3.25 0 1 0 8.75 12 A 3.25 3.25 0 1 0 15.25 12 Z" fill="currentColor" fill-rule="evenodd"/></svg><span>読書設定</span>';
    mobileSettings.setAttribute("aria-label", "読書設定を開く");
    mobileSettings.addEventListener("click", event => {
      event.stopPropagation();
      settingsButton.click();
    });
    mobileHeading.append(mobileSettings, mobileTitle, mobileDate);
    document.getElementById("novel-text").prepend(mobileHeading);
  }

  // 縦書きでは本文の末尾に縦書きリンクを置く。
  // 横書きでは非表示になるので、従来のフッターを使う。
  const verticalEndLink = document.createElement("div");
  verticalEndLink.className = "vertical-end-link";
  verticalEndLink.innerHTML = `<div class="end-actions" aria-label="読書後の操作">
    <a class="end-action" href="fanworks.html" aria-label="作品一覧へ戻る" title="作品一覧へ戻る">↩︎</a>
    <button class="end-action bookmark-action" type="button" aria-label="ブックマークに追加" title="ブックマークに追加" aria-pressed="false">☆</button>

  </div>`;
  document.getElementById("novel-text").append(verticalEndLink);
  verticalEndLink.querySelector('a[aria-label="作品一覧へ戻る"]').href = getReturnUrl();


  // 読書画面と作品一覧で共通のブックマーク保存領域。
  const bookmarkStorageKey = "otomeza-bookmarked-works-v1";
  function getBookmarks() {
    try {
      const saved = JSON.parse(localStorage.getItem(bookmarkStorageKey) || "[]");
      return new Set(Array.isArray(saved) ? saved.filter(id => typeof id === "string") : []);
    } catch (_) { return new Set(); }
  }
  function updateBookmarkButtons() {
    const saved = Boolean(currentWork && getBookmarks().has(currentWork.id));
    document.querySelectorAll(".bookmark-action").forEach(button => {
      button.textContent = saved ? "★" : "☆";
      button.classList.toggle("bookmarked", saved);
      button.setAttribute("aria-pressed", String(saved));
      button.setAttribute("aria-label", saved ? "ブックマークを解除" : "ブックマークに追加");
      button.title = saved ? "ブックマークを解除" : "ブックマークに追加";
      button.disabled = !currentWork;
    });
  }
  document.querySelectorAll(".bookmark-action").forEach(button => {
    button.addEventListener("click", () => {
      if (!currentWork) return;
      const saved = getBookmarks();
      if (saved.has(currentWork.id)) saved.delete(currentWork.id);
      else saved.add(currentWork.id);
      try { localStorage.setItem(bookmarkStorageKey, JSON.stringify([...saved])); }
      catch (_) { showShareStatus("ブックマークを保存できませんでした"); }
      updateBookmarkButtons();
    });
  });
  updateBookmarkButtons();
  window.addEventListener("pageshow", updateBookmarkButtons);
  window.addEventListener("storage", event => {
    if (event.key === bookmarkStorageKey) updateBookmarkButtons();
  });

  let shareStatusTimer;
  function showShareStatus(message) {
    const status = document.getElementById("share-status");
    status.textContent = message;
    status.hidden = false;
    clearTimeout(shareStatusTimer);
    shareStatusTimer = setTimeout(() => { status.hidden = true; }, 3500);
  }
  async function shareCurrentWork() {
    if (!currentWork) return;
    const url = new URL(window.location.href);
    url.hash = "";
    // 作品URLに読書設定等の余計なクエリが付かないようにする。
    url.search = new URLSearchParams({ work: currentWork.id }).toString();
    const text = `『${currentWork.title}』\n佐切×杠｜地獄楽`;
    const fullText = `${text}\n${url.href}`;
    if (navigator.share) {
      try {
        await navigator.share({ title: currentWork.title, text, url: url.href });
        return;
      } catch (error) {
        if (error && error.name === "AbortError") return;
        // 共有機能が利用できない場合はコピーに切り替える。
      }
    }
    try {
      await navigator.clipboard.writeText(fullText);
      showShareStatus("タイトル・カップリング・URLをコピーしました");
    } catch (_) {
      // HTTP環境などでクリップボードが使えない場合も文面を取得できるようにする。
      window.prompt("共有用の文章をコピーしてください", fullText);
    }
  }
  document.querySelectorAll(".share-action").forEach(button => {
    button.disabled = !currentWork;
    button.addEventListener("click", shareCurrentWork);
  });

  window.addEventListener("resize", () => {
    document.body.classList.toggle("vertical-reading", !isMicrofiction && settings.direction === "vertical");
  });

  // PC：ホイール1回で縦書きの約1行分を横に進めます。
  layout.addEventListener("wheel", event => {
    if (isMicrofiction || settings.direction !== "vertical" || event.ctrlKey || event.deltaY === 0) return;
    if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    const maxScroll = layout.scrollWidth - layout.clientWidth;
    const direction = event.deltaY > 0 ? -1 : 1;
    const current = layout.scrollLeft;
    if ((direction < 0 && current <= -maxScroll + 1) ||
        (direction > 0 && current >= -1)) return;
    event.preventDefault();
    layout.scrollLeft += direction * settings.fontSize * 2.2;
  }, { passive: false });

  // スマホ縦書き専用：ドラッグ操作と左右端タップ。
  // PCのホイール処理は上記のまま変更しません。
  const mobileScreen = window.matchMedia("(max-width: 600px)");
  let gesture = null;
  let inertiaFrame = null;

  function mobileVertical() {
    return !isMicrofiction && mobileScreen.matches && settings.direction === "vertical";
  }

  function stopInertia() {
    if (inertiaFrame !== null) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  }

  function coast(velocity) {
    let last = performance.now();
    function frame(now) {
      const elapsed = Math.min(now - last, 32);
      last = now;
      const previous = layout.scrollLeft;
      layout.scrollLeft -= velocity * elapsed;
      velocity *= Math.pow(0.94, elapsed / 16);
      const reachedEdge = Math.abs(layout.scrollLeft - previous) < 0.2;
      if (Math.abs(velocity) > 0.035 && !reachedEdge) {
        inertiaFrame = requestAnimationFrame(frame);
      } else {
        inertiaFrame = null;
      }
    }
    inertiaFrame = requestAnimationFrame(frame);
  }

  layout.addEventListener("touchstart", event => {
    if (!mobileVertical() || event.touches.length !== 1) return;
    stopInertia();
    const touch = event.touches[0];
    gesture = {
      startX: touch.clientX,
      startY: touch.clientY,
      lastX: touch.clientX,
      lastY: touch.clientY,
      lastTime: performance.now(),
      velocity: 0,
      dragging: false,
      vertical: false
    };
  }, { passive: true });

  layout.addEventListener("touchmove", event => {
    if (!mobileVertical() || !gesture || event.touches.length !== 1) return;
    const touch = event.touches[0];
    const x = touch.clientX;
    const y = touch.clientY;
    const totalX = x - gesture.startX;
    const totalY = y - gesture.startY;

    if (!gesture.dragging && !gesture.vertical) {
      if (Math.abs(totalX) > 6 && Math.abs(totalX) > Math.abs(totalY)) {
        gesture.dragging = true;
      } else if (Math.abs(totalY) > 6 && Math.abs(totalY) > Math.abs(totalX)) {
        gesture.vertical = true;
      }
    }

    if (gesture.dragging) {
      // 指が右へ動いたら本文も右へ動くように、スクロール座標は逆方向に更新します。
      event.preventDefault();
      const now = performance.now();
      const elapsed = Math.max(1, now - gesture.lastTime);
      const dx = x - gesture.lastX;
      layout.scrollLeft -= dx;
      const measured = Math.max(-1.8, Math.min(1.8, dx / elapsed));
      gesture.velocity = gesture.velocity * 0.5 + measured * 0.5;
    }
    gesture.lastX = x;
    gesture.lastY = y;
    gesture.lastTime = performance.now();
  }, { passive: false });

  layout.addEventListener("touchend", event => {
    if (event.target.closest("a, button, input, select, textarea")) { gesture = null; return; }
    if (!gesture || !mobileVertical()) { gesture = null; return; }
    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - gesture.startX;
    const deltaY = touch.clientY - gesture.startY;
    const dragged = gesture.dragging || Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10;

    if (gesture.dragging) {
      if (Math.abs(gesture.velocity) > 0.08) coast(gesture.velocity);
    } else if (!dragged) {
      const rect = layout.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const edgeWidth = Math.min(85, rect.width * 0.22);
      const step = layout.clientWidth * 0.85;
      if (x < edgeWidth) {
        // 左端タップ：次のページへ。
        layout.scrollTo({ left: layout.scrollLeft - step, behavior: "smooth" });
      } else if (x > rect.width - edgeWidth) {
        // 右端タップ：前のページへ。
        layout.scrollTo({ left: layout.scrollLeft + step, behavior: "smooth" });
      }
    }
    gesture = null;
  }, { passive: true });

  layout.addEventListener("touchcancel", () => {
    gesture = null;
    stopInertia();
  }, { passive: true });


  // PC縦書き：画面幅の90%ずつページを送る（右＝戻る、左＝進む）。
  function turnDesktopPage(direction) {
    if (isMicrofiction || settings.direction !== "vertical" || window.matchMedia("(max-width: 600px)").matches) return;
    layout.scrollBy({ left: direction * layout.clientWidth * 0.9, behavior: "smooth" });
  }
  document.getElementById("desktop-page-left").addEventListener("click", () => turnDesktopPage(-1));
  document.getElementById("desktop-page-right").addEventListener("click", () => turnDesktopPage(1));

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  applySettings();
  saveSettings();
  resetAfterLayout();
  function stabilizeInitialReading() {
    if (!currentWork) return;
    // 初回表示でフォント読込前の縦書き列幅が残らないよう再計算する。
    void document.getElementById("novel-text").offsetWidth;
    refreshReadingLayout({ resetVerticalPosition: true });
  }
  window.addEventListener("load", () => {
    stabilizeInitialReading();
    window.scrollTo(0, 0);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      stabilizeInitialReading();
      requestAnimationFrame(stabilizeInitialReading);
    });
  }
  window.addEventListener("pageshow", event => {
    if (event.persisted) stabilizeInitialReading();
  });
</script>
