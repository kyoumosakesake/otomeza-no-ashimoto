<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品を読む｜乙女座の脚元</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --background: #1d3652;
    --foreground: #ffffff;
    --accent: #28bfb0;
    --font-size: 16px;
    --reading-font: "Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN", serif;
  }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--reading-font);
  }
  body.light-mode { --background: #ffffff; --foreground: #171717; }
  button, input { font-family: inherit; }
  .site-header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  .site-name {
    color: var(--foreground);
    font-size: .9rem;
    letter-spacing: .12em;
    text-decoration: none;
  }
  .settings-button {
    padding: .55rem .9rem;
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--foreground);
    border-radius: 4px;
    font-size: .85rem;
    cursor: pointer;
  }
  .settings-button:hover { color: var(--accent); border-color: var(--accent); }
  .settings-panel {
    display: none;
    position: absolute;
    top: 75px;
    right: 20px;
    width: min(320px, calc(100vw - 40px));
    max-height: calc(100vh - 95px);
    overflow-y: auto;
    padding: 1.4rem;
    background: var(--background);
    color: var(--foreground);
    border: 1px solid var(--foreground);
    border-radius: 7px;
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
    z-index: 1000;
  }
  .settings-panel.open { display: block; }
  .settings-title { margin: 0 0 1.3rem; font-size: 1rem; font-weight: 400; }
  .setting-group { margin-bottom: 1.4rem; }
  .setting-label { display: block; margin-bottom: .65rem; font-size: .8rem; opacity: .75; }
  .setting-buttons { display: flex; gap: .5rem; }
  .setting-option {
    flex: 1;
    padding: .6rem .3rem;
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--foreground);
    border-radius: 4px;
    font-size: .85rem;
    cursor: pointer;
    opacity: .6;
  }
  .setting-option.active {
    background: var(--accent);
    color: #1d3652;
    border-color: var(--accent);
    opacity: 1;
  }
  .slider-wrap { position: relative; padding: .35rem 0 .5rem; }
  .font-slider {
    display: block;
    position: relative;
    z-index: 2;
    width: 100%;
    margin: .5rem 0;
    accent-color: var(--accent);
    background: transparent;
  }
  .slider-dots {
    position: absolute;
    z-index: 1;
    left: 8px;
    right: 8px;
    top: calc(.35rem + .5rem + 8px);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .slider-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--foreground);
    opacity: .8;
    transform: translate(-50%, -50%);
  }
  .slider-dots span:first-child { transform: translate(0, -50%); }
  .slider-dots span:last-child { transform: translate(-100%, -50%); }
  .font-slider-labels { display: flex; justify-content: space-between; font: .7rem sans-serif; opacity: .65; }
  .settings-close {
    width: 100%; padding: .7rem;
    background: var(--foreground);
    color: var(--background);
    border: 1px solid var(--foreground);
    border-radius: 4px; cursor: pointer;
  }
  .reading-layout { width: 100%; min-height: 70vh; }
  .work-header { color: var(--foreground); }
  .work-title { margin: 0; font-weight: 400; letter-spacing: .12em; line-height: 1.8; }
  .work-date { margin: 0; font-size: .8rem; opacity: .6; }
  .reader { min-width: 0; font-family: var(--reading-font); }
  .novel-text {
    font-size: var(--font-size);
    line-height: 2.2;
    letter-spacing: 1px;
    line-break: strict;
    word-break: normal;
    hanging-punctuation: allow-end;
    overflow-wrap: normal;
  }
  /* スマホ縦書きのみ、本文と同じ組版フローにタイトルを入れる */
  .mobile-vertical-title { display: none; }
  .novel-text p { margin: 0; padding: 0; text-indent: 0; white-space: pre-wrap; }
  .kinsoku-pair { white-space: nowrap; }
  .tcy { text-combine-upright: all; -webkit-text-combine: horizontal; }
  ruby { ruby-position: over; }
  rt { font-size: .5em; font-weight: normal; letter-spacing: 0; }

  /* 横書き */
  .reading-layout.horizontal { display: block; }
  .reading-layout.horizontal .work-header {
    max-width: 800px; margin: 3rem auto 2rem;
    padding: 0 1.5rem; text-align: center;
  }
  .reading-layout.horizontal .work-title { font-size: 1.7rem; }
  .reading-layout.horizontal .work-date { margin-top: .8rem; }
  .reading-layout.horizontal .reader {
    max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 5rem;
  }
  .reading-layout.horizontal .novel-text { writing-mode: horizontal-tb; }
  .reading-layout.horizontal .novel-blank-line { height: 1em; }

  /* 縦書き：右端にタイトル、その左に本文 */
  .reading-layout.vertical {
    display: flex;
    flex-direction: row;
    direction: rtl;
    align-items: flex-start;
    gap: 2.5rem;
    width: 100%;
    max-width: 100vw;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100dvh;
    min-height: 0;
    padding: 1.25rem 1.5rem .35rem;
    scroll-behavior: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: auto; /* 横スワイプはブラウザのネイティブスクロールに任せる */
  }
  .reading-layout.vertical .work-header {
    display: none;
    flex: 0 0 auto;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 1.2rem;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    direction: ltr;
    height: 65vh;
    padding: 1rem 0;
  }
  .reading-layout.vertical .work-title { font-size: 1.2rem; line-height: 1.7; }
  .reading-layout.vertical .work-date { font-size: .75rem; margin: 0; }
  .reading-layout.vertical .reader {
    flex: 0 0 auto;
    width: max-content;
    min-width: 0;
    overflow: visible;
    padding: .5rem 0 .35rem;
    direction: ltr;
  }
  .reading-layout.vertical .novel-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    direction: ltr;
    height: calc(100dvh - 3rem);
    width: max-content;
    min-width: 0;
    margin: 0;
  }
  .reading-layout.vertical .work-header { display: none; }
  /* PC・スマホ共通：タイトルと設定を本文の最初の列に置く。 */
  .reading-layout.vertical .mobile-vertical-title {
    display: block;
    margin-block-end: 1.5rem;
    font-size: 16px;
    line-height: 1.8;
    letter-spacing: .12em;
  }
  .reading-layout.vertical .mobile-vertical-title h2 {
    margin: 0;
    font-size: 1em;
    line-height: 1.8;
    font-weight: 400;
  }
  .reading-layout.vertical .mobile-vertical-title .mobile-date {
    margin: 0;
    font-size: .7em;
    opacity: .6;
    letter-spacing: 0;
  }
  .reading-layout.vertical .mobile-settings-button {
    display: block;
    writing-mode: horizontal-tb;
    white-space: nowrap;
    font-family: sans-serif;
    font-size: 12px;
    padding: .5rem .65rem;
    width: max-content;
    margin: 0 0 0 2rem;
  }
  /* 縦書きでは設定を横スクロールの先頭にだけ表示する */
  body.vertical-reading .site-header { display: none; }
  /* ↩ の矢印の先端が左を向く角度にする */
  .reading-layout.vertical .vertical-end-link a {
    display: inline-block;
    writing-mode: horizontal-tb;
    transform: rotate(0deg);
    transform-origin: center;
  }
  .reading-layout.vertical .novel-blank-line { display: block; width: 1em; height: auto; }
  /* 縦書きでは本文の最後の列に「作品一覧へ戻る」を置く。 */
  .vertical-end-link { display: none; }
  .reading-layout.vertical .vertical-end-link {
    display: block;
    margin-block-start: 2.5em;
    margin-block-end: 1.5em;
    font-size: .9em;
    line-height: 2;
    white-space: nowrap;
  }
  .reading-layout.vertical .vertical-end-link a {
    color: var(--foreground);
    text-decoration: none;
    opacity: .75;
  }
  .reading-layout.vertical .vertical-end-link a:hover { color: var(--accent); opacity: 1; }
  .reading-layout.vertical .vertical-end-link a {
    font-size: 1.7rem;
    line-height: 1.5;
  }
  .reading-layout.vertical + .work-footer { display: none; }
  .work-footer { max-width: 800px; margin: 3rem auto 5rem; padding: 0 1.5rem; text-align: center; }
  .back-link { color: var(--foreground); font-size: 1.7rem; text-decoration: none; opacity: .7; }
  .back-link:hover { color: var(--accent); opacity: 1; }
  @media (max-width: 600px) {
    .site-header { padding: 1.2rem 1rem; }
    .site-name { font-size: .8rem; }
    /* LTRのスクロール座標と既存のドラッグ操作を維持する。 */
    .reading-layout.vertical {
      direction: ltr;
      flex-direction: row;
      gap: 0;
      height: auto;
      min-height: 70vh;
      padding: 2.25rem .75rem 2rem;
      overflow-x: scroll;
      overflow-y: hidden;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    /* タイトルを独立したflex要素にすると並びが反転するため、
       スマホ縦書きでは本文の最初の列として表示する。 */
    .reading-layout.vertical .work-header { display: none; }
    .reading-layout.vertical .reader { padding: .5rem 0; }
    /* ページ上端・設定ボタンとタイトルの間に余白を作る */
    .reading-layout.vertical .mobile-vertical-title {
      padding-inline-start: 1rem;
    }
    .reading-layout.vertical .mobile-settings-button {
      margin-left: 2.25rem;
      margin-inline-start: 1rem;
    }
    /* 上下の余白を確保し、本文が画面下にはみ出さない高さにする */
    .reading-layout.vertical .novel-text {
      height: max(360px, calc(100dvh - 110px));
    }
    .reading-layout.vertical .work-header {
      height: max(360px, calc(100dvh - 110px));
    }
    .reading-layout.horizontal .work-title { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<header class="site-header">
  <button class="settings-button" id="settings-button" type="button" aria-expanded="false" aria-controls="settings-panel">⚙ 読書設定</button>
</header>

<div class="settings-panel" id="settings-panel" role="dialog" aria-label="読書設定">
  <h2 class="settings-title">読書設定</h2>
  <div class="setting-group">
    <span class="setting-label">組み方向</span>
    <div class="setting-buttons">
      <button class="setting-option" data-setting="direction" data-value="vertical" type="button">縦書き</button>
      <button class="setting-option" data-setting="direction" data-value="horizontal" type="button">横書き</button>
    </div>
  </div>
  <div class="setting-group">
    <span class="setting-label">フォント</span>
    <div class="setting-buttons">
      <button class="setting-option" data-setting="font" data-value="mincho" type="button">明朝体</button>
      <button class="setting-option" data-setting="font" data-value="gothic" type="button">ゴシック体</button>
    </div>
  </div>
  <div class="setting-group">
    <label class="setting-label" for="font-size-slider">文字サイズ</label>
    <div class="slider-wrap">
      <div class="slider-dots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <input class="font-slider" id="font-size-slider" type="range" min="0" max="4" step="1" value="2" aria-label="文字サイズ（12・14・16・18・20ピクセル）">
    </div>
    <div class="font-slider-labels"><span>小</span><span>標準</span><span>大</span></div>
  </div>
  <div class="setting-group">
    <span class="setting-label">画面の色</span>
    <div class="setting-buttons">
      <button class="setting-option" data-setting="theme" data-value="dark" type="button">ダーク</button>
      <button class="setting-option" data-setting="theme" data-value="light" type="button">ライト</button>
    </div>
  </div>
  <button class="settings-close" id="settings-close" type="button">閉じる</button>
</div>

<div class="reading-layout vertical" id="reading-layout">
  <div class="work-header">
    <h1 class="work-title" id="work-title">読み込み中…</h1>
    <p class="work-date" id="work-date"></p>
  </div>
  <main class="reader" id="reader">
    <article class="novel-text" id="novel-text"></article>
  </main>
</div>

<footer class="work-footer"><a class="back-link" href="fanworks.html" aria-label="作品一覧へ戻る" title="作品一覧へ戻る">↩︎</a></footer>

<script src="novels.js?v=20261026-4"></script>
<script>
  const fontSizes = [12, 14, 16, 18, 20];
  const storageKey = "otomeza-reader-settings";
  const defaultSettings = { direction: "vertical", font: "mincho", theme: "dark", fontSize: 16 };
  let savedSettings = {};
  try { savedSettings = JSON.parse(localStorage.getItem(storageKey)) || {}; }
  catch (error) { savedSettings = {}; }
  const settings = { ...defaultSettings, ...savedSettings };
  // 以前の5段階（16～24px）から移行するときは標準を16pxに戻します。
  if (settings.fontScaleVersion !== 2) settings.fontSize = 16;
  settings.fontScaleVersion = 2;
  if (!fontSizes.includes(Number(settings.fontSize))) settings.fontSize = 16;
  settings.fontSize = Number(settings.fontSize);
  if (!["vertical", "horizontal"].includes(settings.direction)) settings.direction = "vertical";
  if (!["mincho", "gothic"].includes(settings.font)) settings.font = "mincho";
  if (!["dark", "light"].includes(settings.theme)) settings.theme = "dark";

  const layout = document.getElementById("reading-layout");
  const settingsButton = document.getElementById("settings-button");
  const settingsPanel = document.getElementById("settings-panel");
  const fontSizeSlider = document.getElementById("font-size-slider");

  function saveSettings() {
    try { localStorage.setItem(storageKey, JSON.stringify(settings)); }
    catch (error) { /* 保存できなくても読書は続けられます */ }
  }
  function applySettings() {
    layout.classList.toggle("vertical", settings.direction === "vertical");
    layout.classList.toggle("horizontal", settings.direction === "horizontal");
    document.documentElement.style.setProperty("--reading-font",
      settings.font === "gothic"
        ? '"Yu Gothic", "游ゴシック", "YuGothic", "Hiragino Kaku Gothic ProN", sans-serif'
        : '"Yu Mincho", "游明朝", "YuMincho", "Hiragino Mincho ProN", serif');
    document.documentElement.style.setProperty("--font-size", `${settings.fontSize}px`);
    fontSizeSlider.value = String(fontSizes.indexOf(settings.fontSize));
    document.body.classList.toggle("light-mode", settings.theme === "light");
    document.body.classList.toggle("vertical-reading", settings.direction === "vertical");
    document.querySelectorAll(".setting-option").forEach(button => {
      const active = settings[button.dataset.setting] === button.dataset.value;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
  }
  function resetReadingPosition() {
    if (settings.direction !== "vertical") return;
    // スマホはLTR座標。右端（タイトル）から読み始めます。
    if (mobileScreen.matches) {
      layout.scrollLeft = layout.scrollWidth - layout.clientWidth;
    } else {
      layout.scrollLeft = 0;
    }
  }
  function resetAfterLayout() {
    requestAnimationFrame(() => {
      resetReadingPosition();
      requestAnimationFrame(resetReadingPosition);
    });
  }
  document.querySelectorAll(".setting-option").forEach(button => {
    button.addEventListener("click", () => {
      const previousDirection = settings.direction;
      settings[button.dataset.setting] = button.dataset.value;
      applySettings();
      saveSettings();
      if (settings.direction === "vertical" && previousDirection !== "vertical") resetAfterLayout();
    });
  });
  fontSizeSlider.addEventListener("input", () => {
    settings.fontSize = fontSizes[Number(fontSizeSlider.value)];
    applySettings();
    saveSettings();
  });
  function toggleSettingsPanel(open) {
    settingsPanel.classList.toggle("open", open);
    settingsButton.setAttribute("aria-expanded", String(open));
  }
  settingsButton.addEventListener("click", () => toggleSettingsPanel(!settingsPanel.classList.contains("open")));
  document.getElementById("settings-close").addEventListener("click", () => toggleSettingsPanel(false));
  document.addEventListener("click", event => {
    if (!settingsPanel.contains(event.target) && !settingsButton.contains(event.target)) toggleSettingsPanel(false);
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") toggleSettingsPanel(false);
  });

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
  }
  function formatPlainText(value) {
    // 「!?」など2文字の記号を縦中横にします。
    // 「～」「〜」は直前の文字と組にして行頭への孤立を防ぎます。
    return String(value).split(/([!?！？]{2}|[^\s～〜][～〜])/g).map(part => {
      if (/^[!?！？]{2}$/.test(part)) return `<span class="tcy">${escapeHTML(part)}</span>`;
      if (/^[^\s～〜][～〜]$/.test(part)) return `<span class="kinsoku-pair">${escapeHTML(part)}</span>`;
      return escapeHTML(part);
    }).join("");
  }
  function formatNovelText(text) {
    const source = String(text ?? "").replace(/\r\n?/g, "\n");
    if (source.length === 0) return "<p>ここに本文が入ります。</p>";
    const rubyPattern = /\[\[rb:\s*([^>\]\n]+?)\s*>\s*([^\]\n]+?)\s*\]\]/g;
    return source.split("\n").map(line => {
      if (line === "") return '<div class="novel-blank-line"></div>';
      let html = "";
      let lastIndex = 0;
      for (const match of line.matchAll(rubyPattern)) {
        html += formatPlainText(line.slice(lastIndex, match.index));
        html += `<ruby>${escapeHTML(match[1].trim())}<rt>${escapeHTML(match[2].trim())}</rt></ruby>`;
        lastIndex = match.index + match[0].length;
      }
      html += formatPlainText(line.slice(lastIndex));
      return `<p>${html}</p>`;
    }).join("\n");
  }

  const workId = new URLSearchParams(window.location.search).get("work");
  const novelList = typeof novels !== "undefined" && Array.isArray(novels) ? novels : [];
  const currentWork = novelList.find(work => work.id === workId);
  if (currentWork) {
    document.getElementById("work-title").textContent = currentWork.title;
    document.getElementById("work-date").textContent = currentWork.date || "";
    document.getElementById("novel-text").innerHTML = formatNovelText(currentWork.text);
    document.title = `${currentWork.title}｜乙女座の脚元`;
  } else {
    document.getElementById("work-title").textContent = "作品が見つかりません";
    document.getElementById("work-date").textContent = "";
    document.getElementById("novel-text").innerHTML = "<p>作品データを確認してください。</p>";
  }

  // PC・スマホとも縦書きのタイトルは本文の最初の列に置く。
  // 本文データは変更せず、横書きではこの要素を非表示にする。
  if (currentWork) {
    const mobileHeading = document.createElement("div");
    mobileHeading.className = "mobile-vertical-title";
    const mobileTitle = document.createElement("h2");
    mobileTitle.textContent = currentWork.title;
    const mobileDate = document.createElement("p");
    mobileDate.className = "mobile-date";
    mobileDate.textContent = currentWork.date || "";
    const mobileSettings = document.createElement("button");
    mobileSettings.type = "button";
    mobileSettings.className = "settings-button mobile-settings-button";
    mobileSettings.textContent = "⚙ 読書設定";
    mobileSettings.setAttribute("aria-label", "読書設定を開く");
    mobileSettings.addEventListener("click", event => {
      event.stopPropagation();
      settingsButton.click();
    });
    mobileHeading.append(mobileSettings, mobileTitle, mobileDate);
    document.getElementById("novel-text").prepend(mobileHeading);
  }

  // 縦書きでは本文の末尾に縦書きリンクを置く。
  // 横書きでは非表示になるので、従来のフッターを使う。
  const verticalEndLink = document.createElement("div");
  verticalEndLink.className = "vertical-end-link";
  verticalEndLink.innerHTML = '<a href="fanworks.html" aria-label="作品一覧へ戻る" title="作品一覧へ戻る">↩︎</a>';
  document.getElementById("novel-text").append(verticalEndLink);

  window.addEventListener("resize", () => {
    document.body.classList.toggle("vertical-reading", settings.direction === "vertical");
  });

  // PC：ホイール1回で縦書きの約1行分を横に進めます。
  layout.addEventListener("wheel", event => {
    if (settings.direction !== "vertical" || event.ctrlKey || event.deltaY === 0) return;
    if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    const maxScroll = layout.scrollWidth - layout.clientWidth;
    const direction = event.deltaY > 0 ? -1 : 1;
    const current = layout.scrollLeft;
    if ((direction < 0 && current <= -maxScroll + 1) ||
        (direction > 0 && current >= -1)) return;
    event.preventDefault();
    layout.scrollLeft += direction * settings.fontSize * 2.2;
  }, { passive: false });

  // スマホ縦書き専用：ドラッグ操作と左右端タップ。
  // PCのホイール処理は上記のまま変更しません。
  const mobileScreen = window.matchMedia("(max-width: 600px)");
  let gesture = null;
  let inertiaFrame = null;

  function mobileVertical() {
    return mobileScreen.matches && settings.direction === "vertical";
  }

  function stopInertia() {
    if (inertiaFrame !== null) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  }

  function coast(velocity) {
    let last = performance.now();
    function frame(now) {
      const elapsed = Math.min(now - last, 32);
      last = now;
      const previous = layout.scrollLeft;
      layout.scrollLeft -= velocity * elapsed;
      velocity *= Math.pow(0.94, elapsed / 16);
      const reachedEdge = Math.abs(layout.scrollLeft - previous) < 0.2;
      if (Math.abs(velocity) > 0.035 && !reachedEdge) {
        inertiaFrame = requestAnimationFrame(frame);
      } else {
        inertiaFrame = null;
      }
    }
    inertiaFrame = requestAnimationFrame(frame);
  }

  layout.addEventListener("touchstart", event => {
    if (!mobileVertical() || event.touches.length !== 1) return;
    stopInertia();
    const touch = event.touches[0];
    gesture = {
      startX: touch.clientX,
      startY: touch.clientY,
      lastX: touch.clientX,
      lastY: touch.clientY,
      lastTime: performance.now(),
      velocity: 0,
      dragging: false,
      vertical: false
    };
  }, { passive: true });

  layout.addEventListener("touchmove", event => {
    if (!mobileVertical() || !gesture || event.touches.length !== 1) return;
    const touch = event.touches[0];
    const x = touch.clientX;
    const y = touch.clientY;
    const totalX = x - gesture.startX;
    const totalY = y - gesture.startY;

    if (!gesture.dragging && !gesture.vertical) {
      if (Math.abs(totalX) > 6 && Math.abs(totalX) > Math.abs(totalY)) {
        gesture.dragging = true;
      } else if (Math.abs(totalY) > 6 && Math.abs(totalY) > Math.abs(totalX)) {
        gesture.vertical = true;
      }
    }

    if (gesture.dragging) {
      // 指が右へ動いたら本文も右へ動くように、スクロール座標は逆方向に更新します。
      event.preventDefault();
      const now = performance.now();
      const elapsed = Math.max(1, now - gesture.lastTime);
      const dx = x - gesture.lastX;
      layout.scrollLeft -= dx;
      const measured = Math.max(-1.8, Math.min(1.8, dx / elapsed));
      gesture.velocity = gesture.velocity * 0.5 + measured * 0.5;
    }
    gesture.lastX = x;
    gesture.lastY = y;
    gesture.lastTime = performance.now();
  }, { passive: false });

  layout.addEventListener("touchend", event => {
    if (!gesture || !mobileVertical()) { gesture = null; return; }
    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - gesture.startX;
    const deltaY = touch.clientY - gesture.startY;
    const dragged = gesture.dragging || Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10;

    if (gesture.dragging) {
      if (Math.abs(gesture.velocity) > 0.08) coast(gesture.velocity);
    } else if (!dragged) {
      const rect = layout.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const edgeWidth = Math.min(85, rect.width * 0.22);
      const step = layout.clientWidth * 0.85;
      if (x < edgeWidth) {
        // 左端タップ：次のページへ。
        layout.scrollTo({ left: layout.scrollLeft - step, behavior: "smooth" });
      } else if (x > rect.width - edgeWidth) {
        // 右端タップ：前のページへ。
        layout.scrollTo({ left: layout.scrollLeft + step, behavior: "smooth" });
      }
    }
    gesture = null;
  }, { passive: true });

  layout.addEventListener("touchcancel", () => {
    gesture = null;
    stopInertia();
  }, { passive: true });

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  applySettings();
  saveSettings();
  resetAfterLayout();
  window.addEventListener("load", () => {
    resetAfterLayout();
    window.scrollTo(0, 0);
  });
</script>
</body>
</html>
